<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ロールケーキで分数を知ろう！</title>
<style>
  :root {
    --bg1: #fff9ee;
    --bg2: #ffe9c7;
    --ink: #5a3510;
    --orange: #f28a2e;
    --orange-dark: #c96a14;
    --blue: #2f80ed;
    --blue-soft: #e5f0ff;
    --red: #e63b6f;
    --red-soft: #ffe4ec;
    --card: #ffffff;
    --line: #ecd9b8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "BIZ UDPGothic", "Hiragino Maru Gothic ProN", "Yu Gothic UI", "Meiryo", sans-serif;
    color: var(--ink);
    background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }
  .app {
    max-width: 1100px;
    margin: 0 auto;
    padding: 14px 14px 36px;
  }

  /* ---------- タイトルと説明バナー ---------- */
  h1 {
    margin: 4px 0 10px;
    font-size: clamp(22px, 3.6vw, 38px);
    font-weight: 800;
    letter-spacing: .04em;
    text-align: center;
  }
  .banner {
    background: #fff;
    border: 4px solid var(--orange);
    border-radius: 20px;
    padding: 12px 18px;
    text-align: center;
    font-size: clamp(20px, 3.2vw, 36px);
    font-weight: 800;
    line-height: 1.4;
    box-shadow: 0 5px 0 var(--orange-dark);
  }

  /* ---------- ロールケーキ ---------- */
  .stage { margin: 8px 0 4px; }
  #cake {
    width: 100%;
    height: auto;
    display: block;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  .piece { cursor: pointer; outline: none; transition: transform .22s ease, opacity .25s; }
  .piece { animation: drop .45s ease backwards; animation-delay: calc(var(--i) * 45ms); }
  @keyframes drop {
    from { opacity: 0; transform: translateY(-26px); }
    to   { opacity: 1; transform: none; }
  }
  .piece .body  { fill: url(#gSponge); stroke: #8a5320; stroke-width: 3; stroke-linejoin: round; transition: stroke .2s; }
  .piece .shine { fill: #fff; opacity: .22; pointer-events: none; }
  .piece .face  { fill: #f8d98f; stroke: #c27a2e; stroke-width: 4; }
  .piece .swirl { fill: none; stroke: #fffaf0; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  .piece .check { display: none; pointer-events: none; }
  .piece .check circle { fill: #fff; stroke: var(--red); stroke-width: 4; }
  .piece .check path   { fill: none; stroke: var(--red); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }

  .piece.sel { transform: translateY(-14px); }
  .piece.sel .body { fill: url(#gSel); stroke: #c2185b; stroke-width: 4; }
  .piece.sel .face { fill: #ffe0e8; stroke: #d63a6a; }
  .piece.sel .check { display: block; }
  .piece:focus-visible .body { stroke: var(--blue); stroke-width: 6; }
  @media (hover: hover) {
    .piece:hover .body { stroke: #5b3410; stroke-width: 4; }
    .piece.sel:hover .body { stroke: #c2185b; }
  }

  .u-text { font-size: 26px; font-weight: 800; }
  .u-blue { fill: var(--blue); }
  .u-red { fill: var(--red); }
  .u-gray { fill: #a39784; }
  .u-brown { fill: var(--ink); font-size: 30px; }

  /* 分母・分子カードをタップしたときの強調 */
  #cake.hl-den .piece .body { stroke: var(--blue); stroke-width: 7; }
  #cake.hl-den .bar-b { animation: pulse .6s ease 3; transform-box: fill-box; transform-origin: center; }
  #cake.hl-num .piece:not(.sel) { opacity: .35; }
  #cake.hl-num .piece.sel .body { stroke-width: 8; }
  #cake.hl-num .bar-r { animation: pulse .6s ease 3; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse {
    50% { transform: scaleY(1.9); }
  }

  /* ---------- ボタン ---------- */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    align-items: center;
    margin: 10px 0 14px;
  }
  .controls-label {
    flex-basis: 100%;
    text-align: center;
    font-weight: 800;
    font-size: clamp(16px, 2.2vw, 22px);
  }
  .btn {
    font-family: inherit;
    font-size: clamp(18px, 2.4vw, 26px);
    font-weight: 800;
    min-height: 60px;
    padding: 8px 20px;
    border-radius: 16px;
    border: 3px solid var(--orange);
    background: #fff;
    color: var(--orange-dark);
    box-shadow: 0 5px 0 var(--orange);
    cursor: pointer;
    transition: transform .1s, box-shadow .1s, background .2s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--orange); }
  .btn.on { background: var(--orange); color: #fff; box-shadow: 0 5px 0 var(--orange-dark); }
  .btn:focus-visible { outline: 4px solid var(--blue); outline-offset: 2px; }
  .btn.reset {
    border-color: #4e9a6a;
    color: #2f7a4d;
    box-shadow: 0 5px 0 #4e9a6a;
    margin-left: 8px;
  }
  .btn.reset:active { box-shadow: 0 1px 0 #4e9a6a; }

  /* ---------- 結果と意味 ---------- */
  .bottom {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }
  @media (min-width: 840px) {
    .bottom.two { grid-template-columns: 1fr 1fr; }
  }
  .card {
    background: var(--card);
    border: 3px solid var(--line);
    border-radius: 22px;
    padding: 16px 18px;
  }
  .result { text-align: center; }
  .msg {
    font-size: clamp(22px, 3.4vw, 38px);
    font-weight: 800;
    line-height: 1.35;
    min-height: 1.4em;
  }
  .sub { font-size: clamp(16px, 2.2vw, 22px); font-weight: 700; margin-top: 4px; color: #7a5a35; }

  .frac {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    margin: 10px 0 2px;
    font-size: clamp(64px, 12vw, 120px);
    font-weight: 800;
    line-height: 1.05;
    min-width: 1.4em;
  }
  .frac .num { color: var(--red); }
  .frac .den { color: var(--blue); }
  .frac .num.empty { color: #c9bda8; }
  .frac .bar { width: 100%; height: .07em; min-height: 5px; background: var(--ink); border-radius: 4px; margin: .06em 0; }
  .frac.whole .bar, .frac.whole .num { display: none; }
  .frac.whole .den { color: var(--ink); }
  .bump { animation: bump .35s ease; }
  @keyframes bump {
    0% { transform: scale(1); }
    40% { transform: scale(1.25); }
    100% { transform: scale(1); }
  }
  .reading { font-size: clamp(18px, 2.4vw, 26px); font-weight: 700; min-height: 1.4em; color: #7a5a35; }

  .meaning h2 { margin: 0 0 10px; font-size: clamp(18px, 2.4vw, 24px); }
  .meaning.hidden { display: none; }
  .m-card {
    display: block;
    width: 100%;
    text-align: left;
    font-family: inherit;
    color: var(--ink);
    border-radius: 16px;
    padding: 12px 14px;
    margin-bottom: 10px;
    cursor: pointer;
    border: 3px solid;
  }
  .m-card:last-child { margin-bottom: 0; }
  .m-card.den { background: var(--blue-soft); border-color: var(--blue); }
  .m-card.num { background: var(--red-soft); border-color: var(--red); }
  .m-card:focus-visible { outline: 4px solid var(--ink); outline-offset: 2px; }
  .m-head { display: flex; align-items: center; gap: 10px; font-size: clamp(20px, 2.8vw, 28px); font-weight: 800; }
  .m-tag { color: #fff; border-radius: 10px; padding: 2px 12px; }
  .den .m-tag { background: var(--blue); }
  .num .m-tag { background: var(--red); }
  .m-desc { font-size: clamp(16px, 2.1vw, 21px); font-weight: 700; margin-top: 4px; }
  .m-val { font-size: clamp(18px, 2.4vw, 24px); font-weight: 800; margin-top: 4px; }
  .den .m-val { color: var(--blue); }
  .num .m-val { color: var(--red); }
  .m-look { font-size: 15px; font-weight: 700; margin-top: 4px; color: #7a5a35; }

  @media (prefers-reduced-motion: reduce) {
    .piece, .bump, #cake.hl-den .bar-b, #cake.hl-num .bar-r { animation: none !important; }
    .piece { transition: none; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>ロールケーキで分数を知ろう！</h1>
  <div id="banner" class="banner" aria-live="polite"></div>

  <div class="stage">
    <svg id="cake" viewBox="0 0 900 380" role="group" aria-label="ロールケーキ"></svg>
  </div>

  <div class="controls" id="controls">
    <div class="controls-label">ボタンをおして、ロールケーキを分けてみよう</div>
    <button class="btn" data-n="2" type="button">2つに分ける</button>
    <button class="btn" data-n="3" type="button">3つに分ける</button>
    <button class="btn" data-n="4" type="button">4つに分ける</button>
    <button class="btn" data-n="5" type="button">5つに分ける</button>
    <button class="btn" data-n="10" type="button">10こに分ける</button>
    <button class="btn reset" id="resetBtn" type="button">↺ はじめから</button>
  </div>

  <section class="bottom" id="bottom">
    <div class="card result">
      <div class="msg" id="msg" aria-live="polite"></div>
      <div class="sub" id="sub"></div>
      <div class="frac" id="frac" aria-live="polite">
        <div class="num" id="numEl">？</div>
        <div class="bar"></div>
        <div class="den" id="denEl">1</div>
      </div>
      <div class="reading" id="reading"></div>
    </div>

    <div class="card meaning hidden" id="meaning">
      <h2>分母と分子のひみつ</h2>
      <button type="button" class="m-card den" id="cardDen">
        <div class="m-head"><span class="m-tag">分母</span><span>全部をいくつに分けたか</span></div>
        <div class="m-val" id="denVal"></div>
        <div class="m-look">タップすると、ケーキに青い線が光るよ</div>
      </button>
      <button type="button" class="m-card num" id="cardNum">
        <div class="m-head"><span class="m-tag">分子</span><span>そのうち、いくつ分を選んだか</span></div>
        <div class="m-val" id="numVal"></div>
        <div class="m-look">タップすると、選んだケーキに赤い線が光るよ</div>
      </button>
    </div>
  </section>
</div>

<script>
(function () {
  'use strict';

  // ---------- 定数・状態 ----------
  var SVG_W = 900;
  var X0 = 50;          // ケーキ左端
  var TOTAL = 800;      // ケーキ全体の長さ（分けた後も同じ合計）
  var CY = 150;         // ケーキ中心のY
  var RY = 92;          // ケーキ半径（高さの半分）

  var n = 1;                 // 分割数（分母）
  var sel = new Set();       // 選んだ部分の番号
  var pieces = [];
  var hlTimer = null;

  var cake = document.getElementById('cake');
  var banner = document.getElementById('banner');
  var msgEl = document.getElementById('msg');
  var subEl = document.getElementById('sub');
  var fracEl = document.getElementById('frac');
  var numEl = document.getElementById('numEl');
  var denEl = document.getElementById('denEl');
  var readingEl = document.getElementById('reading');
  var meaningEl = document.getElementById('meaning');
  var bottomEl = document.getElementById('bottom');
  var denVal = document.getElementById('denVal');
  var numVal = document.getElementById('numVal');
  var piecesG, underG;

  // ---------- ユーティリティ ----------
  function unit(k) { return k === 10 ? k + 'こ' : k + 'つ'; }

  // すべての部分が同じ大きさになるように計算する
  function geometry(count) {
    var p = TOTAL / count;                       // 1つ分が使える幅
    var gap = count === 1 ? 0 : (count >= 10 ? 10 : 14);
    var ex = Math.min(26, p * 0.18);             // 切り口（だ円）の横の半径
    var w = p - gap - 2 * ex;                    // 胴体の長さ
    return { p: p, gap: gap, ex: ex, w: w };
  }

  function spiralPoints(cx, cy, ex, ry) {
    var pts = [];
    var T = Math.PI * 2 * 2;
    for (var t = 0; t <= T; t += 0.15) {
      var r = 0.1 + 0.78 * (t / T);
      var a = t - Math.PI / 2;
      pts.push((cx + ex * r * Math.cos(a)).toFixed(1) + ',' + (cy + ry * r * Math.sin(a)).toFixed(1));
    }
    return pts.join(' ');
  }

  // ---------- ロールケーキの描画 ----------
  function defsHTML() {
    return '' +
      '<defs>' +
      '<linearGradient id="gSponge" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0" stop-color="#f3bf6c"/><stop offset=".5" stop-color="#dc9a42"/><stop offset="1" stop-color="#b9742c"/>' +
      '</linearGradient>' +
      '<linearGradient id="gSel" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0" stop-color="#ffa9bd"/><stop offset=".5" stop-color="#ff7396"/><stop offset="1" stop-color="#e44a80"/>' +
      '</linearGradient>' +
      '</defs>' +
      // お皿
      '<ellipse cx="450" cy="262" rx="438" ry="34" fill="#ffffff" stroke="#eadfc9" stroke-width="4"/>' +
      '<ellipse cx="450" cy="262" rx="396" ry="24" fill="none" stroke="#f1e8d6" stroke-width="3"/>';
  }

  function pieceHTML(i, g) {
    var cx = X0 + i * g.p + g.ex;       // 切り口の中心X
    var ex = g.ex, w = g.w;
    var body = 'M' + cx + ' ' + (CY - RY) + ' H' + (cx + w) +
               ' A' + ex + ' ' + RY + ' 0 0 1 ' + (cx + w) + ' ' + (CY + RY) +
               ' H' + cx + ' Z';
    var sw = Math.max(3, ex * 0.28);
    var cr = n >= 10 ? 13 : 19;          // チェックマークの大きさ
    var s = 1;
    var mid = cx + w / 2;
    return '' +
      '<g class="piece" data-i="' + i + '" style="--i:' + i + '" tabindex="0" role="button" aria-pressed="false" aria-label="' + (i + 1) + 'こめのケーキ">' +
        '<path class="body" d="' + body + '"/>' +
        '<rect class="shine" x="' + cx + '" y="' + (CY - RY + 16) + '" width="' + w + '" height="10" rx="5"/>' +
        '<ellipse class="face" cx="' + cx + '" cy="' + CY + '" rx="' + ex + '" ry="' + RY + '"/>' +
        '<polyline class="swirl" stroke-width="' + sw.toFixed(1) + '" points="' + spiralPoints(cx, CY, ex * 0.92, RY * 0.92) + '"/>' +
        '<g class="check" transform="translate(' + mid + ' ' + CY + ') scale(' + (cr / 19) + ')">' +
          '<circle r="19"/><path d="M-8 1 L-2 8 L9 -7"/>' +
        '</g>' +
      '</g>';
  }

  function renderCake() {
    var g = geometry(n);
    var html = '';
    for (var i = 0; i < n; i++) html += pieceHTML(i, g);
    cake.innerHTML = defsHTML() + '<g id="piecesG">' + html + '</g><g id="underG"></g>';
    piecesG = document.getElementById('piecesG');
    underG = document.getElementById('underG');
    pieces = Array.prototype.slice.call(piecesG.querySelectorAll('.piece'));
  }

  // ケーキの下の線：青＝分けた数（分母）／赤＝選んだ数（分子）
  function underHTML() {
    var g = geometry(n), k = sel.size, s = '', i;
    if (n === 1) {
      var y = 316;
      s += '<path d="M' + X0 + ' ' + (y - 12) + ' V' + y + ' H' + (X0 + TOTAL) + ' V' + (y - 12) +
           '" fill="none" stroke="#5a3510" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>';
      s += '<text x="450" y="364" text-anchor="middle" class="u-text u-brown">ぜんぶで 1本分 ＝ 1</text>';
      return s;
    }
    for (i = 0; i < n; i++) {
      var x = X0 + i * g.p;
      s += '<rect class="bar-b" x="' + x + '" y="304" width="' + (g.p - g.gap) + '" height="10" rx="5" fill="#2f80ed"/>';
      if (sel.has(i)) {
        s += '<rect class="bar-r" x="' + x + '" y="320" width="' + (g.p - g.gap) + '" height="10" rx="5" fill="#e63b6f"/>';
      }
    }
    s += '<text x="250" y="366" text-anchor="middle" class="u-text u-blue">分母 ' + n + '：ぜんぶで' + unit(n) + 'に分けた</text>';
    if (k > 0) {
      s += '<text x="660" y="366" text-anchor="middle" class="u-text u-red">分子 ' + k + '：' + k + 'つ分えらんだ</text>';
    } else {
      s += '<text x="660" y="366" text-anchor="middle" class="u-text u-gray">えらぶと 分子が出るよ</text>';
    }
    return s;
  }

  // ---------- 表示の更新（選択のたびに呼ぶ） ----------
  function bumpEl(el) {
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }

  var lastNum = null, lastDen = null;

  function update() {
    var k = sel.size, i;

    // ケーキの見た目
    for (i = 0; i < pieces.length; i++) {
      var on = sel.has(i);
      pieces[i].classList.toggle('sel', on);
      pieces[i].setAttribute('aria-pressed', on ? 'true' : 'false');
    }
    underG.innerHTML = underHTML();

    // 上の説明
    if (n === 1) {
      banner.textContent = 'このロールケーキ、ぜんぶで1本分だよ！';
    } else {
      banner.textContent = '1本のロールケーキを、同じ大きさの' + unit(n) + 'に分けたよ！';
    }

    // メッセージ
    var msg, sub = '';
    if (k === 0) {
      msg = n === 1 ? 'ケーキをタップするか、下のボタンで分けてみよう！'
                    : 'ケーキをタップして、選んでみよう！';
    } else if (k === n) {
      msg = '全部で1本分！';
      if (n > 1) sub = unit(n) + 'に分けたうちの' + k + 'つ分 ＝ 1本ぜんぶ';
    } else {
      msg = unit(n) + 'に分けたうちの' + k + 'つ分！';
    }
    msgEl.textContent = msg;
    subEl.textContent = sub;

    // 分数（約分しない：分母＝分けた数、分子＝選んだ数）
    var whole = (n === 1 && k === 0);
    fracEl.classList.toggle('whole', whole);
    denEl.textContent = String(n);
    if (k === 0) {
      numEl.textContent = '？';
      numEl.classList.add('empty');
    } else {
      numEl.textContent = String(k);
      numEl.classList.remove('empty');
    }
    if (lastNum !== k && !whole) bumpEl(numEl);
    if (lastDen !== n) bumpEl(denEl);
    lastNum = k; lastDen = n;

    // 読み方
    if (whole) {
      readingEl.textContent = 'まるごと1本が「1」だよ';
    } else if (k === 0) {
      readingEl.textContent = '';
    } else if (n === 1) {
      readingEl.textContent = '1本ぜんぶで「1」';
    } else {
      readingEl.textContent = 'よみかた：「' + n + '分の' + k + '」';
    }

    // 分母と分子の説明（ケーキを分けたあとに表示）
    var showMeaning = n > 1;
    meaningEl.classList.toggle('hidden', !showMeaning);
    bottomEl.classList.toggle('two', showMeaning);
    denVal.textContent = '→ ぜんぶで' + unit(n) + 'に分けたから、分母は ' + n;
    numVal.textContent = k > 0 ? '→ ' + k + 'つ分を選んだから、分子は ' + k
                               : '→ まだ選んでいないよ。ケーキをタップしてみよう';

    // ボタンの強調
    var btns = document.querySelectorAll('#controls .btn[data-n]');
    for (i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('on', Number(btns[i].getAttribute('data-n')) === n);
    }
  }

  // ---------- 操作 ----------
  function clearHighlight() {
    clearTimeout(hlTimer);
    cake.classList.remove('hl-den', 'hl-num');
  }

  function flash(mode) {
    clearHighlight();
    void cake.getBoundingClientRect();
    cake.classList.add('hl-' + mode);
    hlTimer = setTimeout(clearHighlight, 2800);
  }

  function setN(k) {
    if (k === n) return;          // 同じ分け方のときは何も変えない
    n = k;
    sel.clear();
    clearHighlight();
    renderCake();
    update();
  }

  function toggle(i) {
    if (sel.has(i)) sel.delete(i); else sel.add(i);
    update();
  }

  function resetAll() {
    n = 1;
    sel.clear();
    clearHighlight();
    lastNum = null; lastDen = null;
    renderCake();
    update();
  }

  // ---------- イベント ----------
  cake.addEventListener('click', function (e) {
    var t = e.target;
    while (t && t !== cake && !(t.classList && t.classList.contains('piece'))) t = t.parentNode;
    if (!t || t === cake) return;
    toggle(Number(t.getAttribute('data-i')));
  });

  cake.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var t = e.target;
    if (t && t.classList && t.classList.contains('piece')) {
      e.preventDefault();
      toggle(Number(t.getAttribute('data-i')));
    }
  });

  var btns = document.querySelectorAll('#controls .btn[data-n]');
  Array.prototype.forEach.call(btns, function (b) {
    b.addEventListener('click', function () { setN(Number(b.getAttribute('data-n'))); });
  });
  document.getElementById('resetBtn').addEventListener('click', resetAll);

  document.getElementById('cardDen').addEventListener('click', function () { flash('den'); });
  document.getElementById('cardNum').addEventListener('click', function () {
    if (sel.size > 0) flash('num');
  });

  // ---------- 起動 ----------
  renderCake();
  update();
})();
</script>
</body>
</html>
