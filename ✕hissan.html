<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<base target="_top">
<title>ひっ算</title>
<style>
:root{
  --page:#E8F2EE; --paper:#FBFDFC; --grid:#CFE5DF; --grid2:#9DBFB6;
  --ink:#22304A; --ink-soft:#5F6F88; --pencil:#2A2F45;
  --ones:#2468E0; --ones-bg:#DCE8FF;
  --tens:#E8821A; --tens-bg:#FFE9CF;
  --huns:#1F9D5A; --huns-bg:#D6F2E3;
  --carry:#D6336C; --carry-bg:#FFE0EC;
  --ok:#1F8A52; --ok-bg:#DDF5E8; --hint:#9A4A00; --hint-bg:#FFF1CC;
  --mark:#FFE680;
  --thou:#8A5CF6; --thou-bg:#E9E0FF; --cyb:#7C3AED;
  --cell:clamp(5rem,min(20vh,calc((75vw - 16rem)/3.6)),11rem);
  --bw:12.5rem;
  --sign:calc(var(--cell)*.55);
  --font:"UD Digi Kyokasho N-R","UD デジタル 教科書体 N-R","BIZ UDPGothic","Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
}
@media (orientation:portrait){:root{--cell:clamp(5rem,min(14vh,calc((100vw - 18rem)/3.6)),11rem)}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:16px;-webkit-text-size-adjust:100%}
html.big{font-size:19px}
body{
  margin:0;background:var(--page);color:var(--ink);font-family:var(--font);line-height:1.5;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
button,select{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--ones);outline-offset:2px}

/* ---------- 全体レイアウト（10.1〜10.5インチ・横向きを基本に、縦向きにも対応） ---------- */
.app{
  height:100vh;height:100dvh;padding:.5rem;display:grid;gap:.5rem;
  grid-template-columns:minmax(0,1fr) clamp(13rem,18vw,17rem);
  grid-template-rows:minmax(0,1fr);
  grid-template-areas:"paper guide";
}
@media (orientation:portrait){
  .app{
    grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;
    grid-template-areas:"paper" "guide";
  }
}
.a-paper{grid-area:paper;min-height:0}.a-guide{grid-area:guide;min-height:0}
.head-tools{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.chip{border:2.5px solid var(--ink);background:#fff;border-radius:999px;padding:.15rem .6rem;font-size:.95rem;font-weight:700;min-height:2.3rem}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip.tool{border-color:var(--ink-soft);color:var(--ink-soft);font-size:.9rem}

/* ---------- 筆算用紙（方眼ノート） ---------- */
.card{
  position:relative;height:100%;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:1.6rem 1.6rem;
  border:3px solid var(--ink);border-radius:1.2rem;padding:.4rem .5rem;
  display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:.6rem;
}
.bcol{flex:1 1 auto;min-width:9rem;align-self:stretch}
.dock{position:relative;z-index:6;flex:none;display:flex;flex-direction:column;gap:.35rem;align-self:center}
.dbtn{width:4.4rem;min-height:3.6rem;border-radius:.9rem;background:#fff;border:3px solid var(--ink);box-shadow:0 .18rem 0 var(--ink);font-size:.72rem;font-weight:700;line-height:1.15;padding:.15rem}
.dbtn .ic{display:block;font-size:1.4rem;line-height:1.2}
.dbtn:active{transform:translateY(.15rem);box-shadow:0 .03rem 0 var(--ink)}
.dbtn[aria-pressed="true"]{background:var(--ink);color:#fff}
#bubbles{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:4}
#ink{position:absolute;left:0;top:0;width:100%;height:100%;z-index:5;touch-action:none;border-radius:1.1rem;cursor:crosshair}
#ink.off{pointer-events:none}
.board{display:grid;justify-content:center;column-gap:.3rem;
  grid-template-rows:auto calc(var(--cell)*.95) var(--cell) var(--cell) .55rem calc(var(--cell)*1.2)}
.cell{position:relative;display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--cell)*.74);font-weight:700;line-height:1;border-radius:.8rem;
  transition:background .25s,opacity .25s,box-shadow .25s}
.p-o{color:var(--ones)}.p-t{color:var(--tens)}.p-h{color:var(--huns)}.p-k{color:var(--thou)}
.sign,.mult{color:var(--ink)}
.sign{font-size:calc(var(--cell)*.6)}
.rule{align-self:center;height:.38rem;background:var(--ink);border-radius:.2rem}
.dim{opacity:.3}
.circ{position:absolute;left:-.45rem;top:-.45rem;width:calc(100% + .9rem);height:calc(100% + .9rem);overflow:visible;pointer-events:none;transform:rotate(-5deg)}
.circ ellipse{fill:none;stroke-width:5;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;animation:draw .9s ease-out .1s forwards}
.circ.c-on ellipse{stroke:var(--ones)}.circ.c-tn ellipse{stroke:var(--tens)}.circ.c-hn ellipse{stroke:var(--huns)}.circ.c-kn ellipse{stroke:var(--thou)}.circ.c-cy ellipse{stroke:var(--carry)}
@keyframes draw{to{stroke-dashoffset:0}}
.bub2{position:absolute;background:#fff;border:3px solid var(--ones);border-radius:1rem;padding:.35rem .55rem;font-size:1.05rem;font-weight:700;line-height:1.4;box-shadow:0 .2rem .5rem rgba(0,0,0,.12)}
.bub2 small{display:block;font-size:.8rem;font-weight:400;color:var(--ink-soft);margin-top:.2rem}
.bub2::before{content:"";position:absolute;left:-.95rem;top:calc(var(--ty,1.5rem) - .6rem);border:.6rem solid transparent;border-right:.8rem solid var(--ones);border-left:0}
.bub2::after{content:"";position:absolute;left:-.62rem;top:calc(var(--ty,1.5rem) - .5rem);border:.5rem solid transparent;border-right:.65rem solid #fff;border-left:0}
.bub2.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.bub2.ok::before{border-right-color:var(--ok)}.bub2.ok::after{border-right-color:var(--ok-bg)}
.bub2.hint{border-color:#E0A33A;background:var(--hint-bg);color:var(--hint);animation:shake .4s}
.bub2.hint::before{border-right-color:#E0A33A}.bub2.hint::after{border-right-color:var(--hint-bg)}
.bub2.say{color:var(--ink)}
.hdr{font-size:.8rem;font-weight:700;border-radius:.7rem;padding:.15rem .1rem;margin-bottom:.3rem;white-space:nowrap;position:relative;opacity:.5}
.hdr.p-o{background:var(--ones-bg)}.hdr.p-t{background:var(--tens-bg)}.hdr.p-h{background:var(--huns-bg)}.hdr.p-k{background:var(--thou-bg)}
.hdr.on{opacity:1;color:#fff}.hdr.on.p-o{background:var(--ones)}.hdr.on.p-t{background:var(--tens)}.hdr.on.p-h{background:var(--huns)}.hdr.on.p-k{background:var(--thou)}
.hdr .arr{position:absolute;right:-.7rem;top:50%;transform:translateY(-50%);font-size:1rem;color:var(--ink-soft);opacity:.45}
.hdr.on .arr{color:var(--tens);opacity:1}

/* 書く場所（マス目） */
.slot{border:.25rem dashed var(--grid2);background:rgba(255,255,255,.55)}
.slot .ghost{display:none;font-size:calc(var(--cell)*.22);font-weight:700;opacity:.7;position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;line-height:1.2}
.slot.target .ghost{display:block}
.slot.target{animation:blink 1.4s ease-in-out infinite;background:rgba(255,255,255,.9)}
.slot.target.p-o{border-color:var(--ones);color:var(--ones)}
.slot.target.p-t{border-color:var(--tens);color:var(--tens)}
.slot.target.p-h{border-color:var(--huns);color:var(--huns)}
.slot.target.p-k{border-color:var(--thou);color:var(--thou)}
.slot.carry-slot{border-color:#E6B5C9;border-radius:.6rem}
.slot.carry-slot.target{border-color:var(--carry);color:var(--carry);background:var(--carry-bg)}
.slot.carry-slot .ghost{font-size:calc(var(--cell)*.16)}
.slot.carry-slot.cyr1{border-color:#C9B5F0}
.slot.carry-slot.cyr1.target{border-color:var(--cyb);color:var(--cyb);background:#EFE8FF}
.slot.carry-slot{border-width:.18rem}
.slot.touching{box-shadow:0 0 0 .25rem #7BD39F;background:var(--ok-bg)}
.slot.used .tick{position:absolute;right:.1rem;top:-.1rem;font-size:calc(var(--cell)*.2);color:var(--ok);background:#fff;border-radius:.4rem;padding:0 .2rem}
.final{animation:glow 1.6s ease-in-out infinite alternate}
@keyframes blink{50%{box-shadow:0 0 0 .3rem rgba(255,230,128,.9)}}
@keyframes glow{to{box-shadow:0 0 0 .25rem #FFD54A;background:#FFF6CC}}

.c-o{color:var(--ones);font-weight:700}.c-t{color:var(--tens);font-weight:700}.c-h{color:var(--huns);font-weight:700}.c-c{color:var(--carry);font-weight:700}

/* ---------- 右側：今やること・反応・道具 ---------- */
.a-guide{display:flex;flex-direction:column;gap:.5rem;overflow:auto;-webkit-overflow-scrolling:touch}
.panel{background:#fff;border:3px solid var(--ink);border-radius:1.2rem;padding:.7rem .9rem}
.now .dots{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.35rem}
.now .dot{flex:none;width:.8rem;height:.8rem;border-radius:50%;border:2.5px solid var(--ink-soft);background:#fff}
.now .dot.done{background:var(--ok);border-color:var(--ok)}
.now .dot.cur{background:var(--mark);border-color:var(--ink);transform:scale(1.25)}
.now-main{display:flex;align-items:center;gap:.5rem;font-size:1.3rem;word-break:auto-phrase;line-break:strict;font-weight:700;line-height:1.25}
.now-main .num{flex:none;font-size:2.4rem;color:var(--ink)}
.now-say{font-size:1.3rem;font-weight:700;margin:.25rem 0 0}
.now-sub{font-size:1.05rem;color:var(--ink-soft);margin:.1rem 0 0}
.react{min-height:4.6rem;display:flex;flex-direction:column;justify-content:center;gap:.4rem;font-size:1.2rem;font-weight:700}
.react.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.react.hint{background:var(--hint-bg);border-color:#E0A33A;color:var(--hint);animation:shake .4s}
.react.idle{color:var(--ink-soft);font-weight:400}
@keyframes shake{20%{transform:translateX(-.4rem)}50%{transform:translateX(.4rem)}80%{transform:translateX(-.2rem)}}
.detail{font-size:1.05rem;border-color:var(--ones);background:#F4F8FF;max-height:14rem;overflow:auto}
.detail h3{margin:0 0 .3rem;font-size:1.1rem;color:var(--ones)}
.detail p{margin:.25rem 0}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:.45rem}
select#probSel{font-size:1.2rem;font-weight:700;padding:.3rem .6rem;border:3px solid var(--ink);border-radius:.9rem;background:#fff;min-height:2.6rem}
.tools+.btn,.btn.block{display:block;width:100%}
@media (orientation:portrait){.tools{grid-template-columns:repeat(6,1fr)}.tbtn{font-size:.8rem}.tbtn .ic{font-size:1.2rem}}
.tbtn{font-size:1rem;font-weight:700;min-height:3.6rem;border-radius:1rem;background:#fff;border:3px solid var(--ink);box-shadow:0 .22rem 0 var(--ink);padding:.2rem .3rem;line-height:1.2}
.tbtn:active{transform:translateY(.18rem);box-shadow:0 .04rem 0 var(--ink)}
.tbtn[aria-pressed="true"]{background:var(--ink);color:#fff}
.tbtn .ic{display:block;font-size:1.4rem}
.btn{font-size:1.2rem;font-weight:700;padding:.6rem 1rem;border-radius:1rem;background:var(--ones);color:#fff;border:3px solid var(--ink);box-shadow:0 .22rem 0 var(--ink)}
.btn.small{font-size:.95rem;padding:.35rem .8rem;background:#fff;color:var(--ink);align-self:flex-start}
.pick{padding:.5rem .6rem}
.pick-t{font-size:.75rem;font-weight:700;color:var(--ink-soft);margin:.05rem 0 .2rem}
.pick-grid{display:grid;grid-template-columns:1fr 1fr;gap:.3rem;margin-bottom:.3rem}
.pick-cm{display:flex;gap:.3rem;margin-bottom:.4rem}
.pick-row{display:flex;flex-wrap:wrap;gap:.3rem}
.pbtn{font-size:.9rem;font-weight:700;border:3px solid var(--ink);background:#fff;border-radius:.8rem;padding:.25rem .2rem;min-height:2.6rem;line-height:1.2}
.pbtn.sm{flex:1;font-size:.8rem;min-height:2.2rem;padding:.2rem .1rem}
.cell.cyans{justify-self:end;width:72%}
.board.sheet{column-gap:0;align-content:center}
.sh-top{border:.16rem dotted var(--ink-soft);background:rgba(255,255,255,.55);border-radius:0}
.slot.sh-box{border:.24rem solid var(--ink);border-radius:.2rem;background:rgba(255,255,255,.9);margin:0 .25rem}
.slot.sh-box.hang{border-top-width:0;border-radius:0 0 .3rem .3rem}
.slot.sh-box.target{background:#FFFBE0}
.slot.target.sh-box.p-o{border-color:var(--ones)}.slot.target.sh-box.p-t{border-color:var(--tens)}.slot.target.sh-box.p-h{border-color:var(--huns)}.slot.target.sh-box.p-k{border-color:var(--thou)}
.slot.sh-mark{border:.16rem dotted var(--ink-soft);border-radius:.25rem;align-self:start;height:58%;width:86%;justify-self:center;background:rgba(255,255,255,.7)}
.slot.sh-mark.target{border:.18rem solid var(--carry);background:var(--carry-bg)}
.rule.thick{height:.45rem}
.pbtn[aria-pressed="true"]{background:var(--ink);color:#fff}
.padp{padding:.5rem .6rem}
.padg{display:grid;grid-template-columns:repeat(3,1fr);gap:.35rem}
.nbtn{font-size:1.7rem;font-weight:700;min-height:3rem;border-radius:.8rem;background:#fff;border:3px solid var(--ink);box-shadow:0 .15rem 0 var(--ink);line-height:1.1}
.nbtn:active{transform:translateY(.12rem);box-shadow:0 .03rem 0 var(--ink)}
.nbtn.del{font-size:.85rem;background:#F1F4F8}
#teacherOkBtn small{display:block;font-size:.75rem;font-weight:400;opacity:.9}
.kbin{position:absolute;opacity:0;width:1px;height:1px;left:0;top:0}
.nbtn.kb{width:100%;margin-top:.35rem;font-size:.95rem;min-height:2.6rem}
.ver{font-size:.7rem;color:var(--ink-soft);text-align:right;margin-top:.2rem}
.sheet.wide{max-width:62rem}
.calg{display:grid;grid-template-columns:repeat(5,1fr);gap:.6rem}
.calnum{font-weight:700;font-size:1.1rem}
.calnum small{font-weight:400;color:var(--ink-soft);font-size:.8rem}
.calcv{display:block;width:100%;aspect-ratio:1;border:3px solid var(--ink);border-radius:.7rem;background:#fff;touch-action:none;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:1.2rem 1.2rem}
.calbt{display:flex;gap:.3rem;margin-top:.3rem}
.calbt .btn.small{margin-top:0;flex:1;padding:.3rem .2rem}
.praise{font-size:1.15rem;font-weight:400;margin:.3rem 0 .5rem}

/* ここやで */
.here{position:fixed;z-index:60;pointer-events:none;display:flex;flex-direction:column;align-items:center;animation:hop .7s ease-in-out infinite}
.here .bub{background:var(--carry);color:#fff;font-weight:700;font-size:1.4rem;padding:.25rem .9rem;border-radius:999px;border:3px solid #fff;box-shadow:0 .2rem .6rem rgba(0,0,0,.25);white-space:nowrap}
.here .tip{font-size:1.8rem;line-height:1;color:var(--carry);text-shadow:0 0 .2rem #fff}
@keyframes hop{50%{margin-top:-.5rem}}
.here-target{outline:.35rem solid var(--carry);outline-offset:.1rem}

/* きろく・かいせつ */
.drawer{position:fixed;inset:0;z-index:70;background:rgba(34,48,74,.45);display:flex;justify-content:center;align-items:flex-start;padding:1rem;overflow:auto}
.drawer[hidden]{display:none}
.drawer .sheet{background:#fff;border:3px solid var(--ink);border-radius:1.2rem;max-width:44rem;width:100%;padding:1rem 1.2rem}
.sheet h2{font-size:1.2rem;margin:.8rem 0 .4rem}
.sheet h2:first-child{margin-top:0}
.sheet p,.sheet li{margin:.25rem 0}
.sheet ul{margin:0;padding-left:1.2rem}
.cats{display:flex;flex-wrap:wrap;gap:.4rem}
.cat{font-size:.95rem;padding:.2rem .7rem;border-radius:999px;background:#EEF2F6;color:var(--ink-soft);font-weight:700}
.cat.has{background:var(--hint-bg);color:var(--hint)}
.mlog{font-size:.95rem;color:var(--ink-soft)}
.privacy{font-size:.85rem;color:var(--ink-soft)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<noscript>JavaScriptを有効にしてください。</noscript>
<div class="app">

  <section class="a-paper">
    <div class="card" id="paper" aria-label="ひっ算ようし。ゆびやペンで 数字を書こう">
      <div class="dock">
        <button class="dbtn" data-act="pen" id="bPen" aria-pressed="true"><span class="ic">✏️</span>えんぴつ</button>
        <button class="dbtn" data-act="eraser" id="bEraser" aria-pressed="false"><span class="ic">🧽</span>けしごむ</button>
        <button class="dbtn" data-act="hint"><span class="ic">💡</span>ヒント</button>
        <button class="dbtn" data-act="undo"><span class="ic">↩️</span>ひとつ<br>もどる</button>
        <button class="dbtn" data-act="clearStep"><span class="ic">🗑️</span>ぜんぶ<br>けす</button>
        <button class="dbtn" data-act="pad" id="bPad" aria-pressed="false"><span class="ic">🔢</span>すうじ<br>ボタン</button>
        <button class="dbtn" data-act="restart" id="bRestart"><span class="ic">🔄</span>はじめ<br>から</button>
      </div>
      <div id="board"></div>
      <div class="bcol" id="bcol"></div>
      <div id="bubbles" aria-live="polite"></div>
      <canvas id="ink"></canvas>
    </div>
  </section>

  <section class="a-guide">
    <div class="panel pick" id="pick"></div>
    <div class="panel now" id="now"></div>
    <div class="panel padp" id="padPanel" hidden></div>
    <button class="btn block" data-act="teacherOk" id="teacherOkBtn" hidden>先生が「OK」にする</button>
  </section>
</div>

<div class="drawer" id="drawer" hidden>
  <div class="sheet" id="sheet"></div>
</div>

<script>
(function(){
'use strict';

/*HW-START*/
var HW = (function(){
  var N = 40;
  function arc(cx,cy,rx,ry,a0,a1,n){
    var r=[]; n=n||20;
    for(var i=0;i<=n;i++){
      var a=(a0+(a1-a0)*i/n)*Math.PI/180;
      r.push([cx+rx*Math.cos(a), cy+ry*Math.sin(a)]);
    }
    return r;
  }
  function cat(){var r=[];for(var i=0;i<arguments.length;i++)r=r.concat(arguments[i]);return r;}

  // 数字の見本（0〜100 の枠の中。書き方のちがいを複数用意）
  var SHAPES = {
    0:[ [arc(50,50,30,45,270,630,36)], [arc(50,50,22,45,270,630,36)], [arc(50,50,38,44,300,660,36)],
        [arc(50,50,30,45,255,615,32)], [arc(50,50,34,42,200,590,32)] ],
    1:[ [[[50,5],[50,95]]], [[[30,28],[50,5],[50,95]]], [[[30,28],[50,5],[50,95]],[[28,95],[72,95]]] ],
    2:[ [cat(arc(50,32,28,27,185,395,14),[[22,93],[80,93]])],
        [cat(arc(50,32,28,27,185,395,14),[[22,93]])],
        [cat(arc(50,32,28,27,185,395,14),[[22,93]]),[[20,93],[80,93]]] ],
    3:[ [cat(arc(48,27,24,22,200,450,16),arc(48,71,28,23,270,520,18))],
        [cat([[22,8],[75,8],[45,45]],arc(48,71,28,23,270,520,18))] ],
    4:[ [[[62,5],[18,62],[85,62]],[[65,30],[65,95]]],
        [[[28,5],[22,58],[82,58]],[[66,5],[66,95]]],
        [[[62,5],[15,65],[88,65]],[[62,5],[62,95]]] ],
    5:[ [cat([[75,8],[30,8],[26,46]],arc(46,68,28,24,250,520,18))],
        [[[75,8],[30,8]],cat([[30,8],[26,46]],arc(46,68,28,24,250,520,18))] ],
    6:[ [cat([[66,5],[40,28],[28,55]],arc(50,70,26,25,170,530,22))],
        [cat([[62,5],[36,30],[24,62]],arc(50,70,26,25,180,540,22))],
        [[[68,8],[45,18],[28,40],[22,65],[30,85],[50,95],[72,85],[78,65],[65,48],[45,45],[28,58]]],
        [arc(50,68,27,26,0,360,22),[[28,62],[30,40],[45,18],[68,6]]],
        [arc(50,62,30,33,0,360,24),[[66,12],[46,22],[32,40]]],
        [cat([[64,8],[38,24],[26,52]],arc(50,68,26,26,190,550,22))],
        [[[40,6],[35,50],[32,90]],arc(54,68,22,24,0,360,22)],
        [cat([[42,5],[34,62]],arc(52,70,22,24,200,560,22))],
        [cat([[62,5],[28,52]],arc(46,72,24,22,160,520,20))] ],

function guide(st){
  var m=M,n=m.n;
  switch(st.type){
    case 'mul':{
      var text=st.A+'×'+st.B+'を 計算して、'+(st.cin>0?'繰り上がりも合わせる':'答えを書く'),say,sub='';
      if(st.i===0&&st.r===0) say=n===1?'まず、ここをかけよう！':'まず、かける数の一の位の'+m.B[0]+'から！';
      else if(st.i===0) say='つぎは、かける数の十の位の'+m.B[1]+'！ひとつ左のマスから 書くよ！';
      else say='次は、ここをかけよう！'+(st.cin>0?'上に書いた繰り上がりの'+st.cin+'も使うよ！':'');
      sub=st.last?(st.v>=10?'2けたになったら、そのまま左のマスにも書くよ。':''):'答えが 2けたのときは、一の位だけ ここに書くよ。';
      return {text:text,say:say,sub:sub};}
    case 'carry': return {text:'繰り上がりの'+st.cout+'を 書く',say:M.cp==='sheet'?'十の位の'+st.cout+'を、つぎの答えの 右上に 小さく書こう！':(M.cp==='ans'?'十の位の'+st.cout+'を、つぎの答えの上に 小さく書こう！':'十の位の'+st.cout+'を、小さく上に書こう！'),sub:''};
    case 'add':{
      var parts=[];if(st.has0)parts.push(st.x);if(st.has1)parts.push(st.y);if(st.cin>0)parts.push(st.cin);
      return {text:parts.length>1?parts.join('＋')+'を たす':'そのまま 下に書く',
              say:st.c===0?'ここからは たし算！一の位から たそう！':(st.cin>0?'上の小さな'+st.cin+'も たすよ！':'つぎの位も たそう！'),sub:''};}
    case 'addcarry': return {text:'たし算の繰り上がり'+st.cout+'を 書く',say:'十の位の'+st.cout+'を、となりの上に 小さく書こう！',sub:''};
  }
  return {text:'',say:'',sub:''};
}
function hintsFor(st){

              l2:st.B+'の段を '+st.A+'つ目まで 数えよう。'+seq+(st.cin>0?' その答えに 繰り上がりの'+st.cin+'を たそう。':'')+(!st.last?' 答えが2けたなら、一の位だけ ここに書くよ。':'')};}
    case 'carry': return {l1:st.v+'の 十の位の数は いくつかな？',l2:M.cp==='ans'?'十の位の数は、この位の答えには 書かないで、つぎの位の 答えの上に 小さく書くよ（繰り上がり）。':'十の位の数は、答えには 書かないで、となりの位の 上に 小さく書くよ（繰り上がり）。'};

function catOf(st,kind){
  if(kind==='place'||kind==='multi') return '答えの数字の配置';
  if(st.type==='mul') return PLACE[Math.min(st.i,2)]+'の掛け算';
  if(st.type==='carry') return '繰り上がりの記入';
  if(st.type==='addcarry') return '繰り上がりの記入';
  return 'たし算のまちがい';
}

function fitCell(){

/* =========================================================
   手書き：キャンバス
   ========================================================= */
function lineW(){return Math.max(4,cellPx*0.055);}
function layoutMeasure(){
  var r=card.getBoundingClientRect();
  cardW=r.width||1;cardH=r.height||1;
  var d=document.querySelector('.digit'),h=d?d.getBoundingClientRect().height:0;
  cellPx=h>10?h:90;
}
function layoutInk(){
  layoutMeasure();
  dpr=Math.min(window.devicePixelRatio||1,2.5);
  cv.width=Math.round(cardW*dpr);cv.height=Math.round(cardH*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  redrawInk();
}
function drawStroke(s){
  if(s.typed){
    var el=slotByKey(s.key);if(!el)return;
    var rc=relRect(el),fs=Math.round(Math.min(rc.h,cellPx*1.2)*0.8);
    ctx.font='700 '+fs+'px "UD Digi Kyokasho N-R","UD デジタル 教科書体 N-R","Hiragino Maru Gothic ProN","Yu Gothic UI",sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle=s.bad?'#E8821A':'#2A2F45';
    ctx.fillText(String(s.d),rc.x+rc.w/2,rc.y+rc.h/2+fs*0.04);
    return;
  }
  var pts=s.p,i;if(!pts.length)return;
  ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=lineW();
  ctx.strokeStyle=s.bad?'#E8821A':'#2A2F45';ctx.fillStyle=ctx.strokeStyle;
  if(pts.length===1){ctx.beginPath();ctx.arc(pts[0].x*cardW,pts[0].y*cardH,lineW()/2,0,6.2832);ctx.fill();return;}
  ctx.beginPath();ctx.moveTo(pts[0].x*cardW,pts[0].y*cardH);
  for(i=1;i<pts.length;i++)ctx.lineTo(pts[i].x*cardW,pts[i].y*cardH);
  ctx.stroke();
}
function redrawInk(){ctx.clearRect(0,0,cardW,cardH);S.ink.forEach(drawStroke);}
function flashRemove(objs){
  if(!objs||!objs.length)return;
  objs.forEach(function(o){o.bad=true;});redrawInk();
  setTimeout(function(){S.ink=S.ink.filter(function(o){return !o.bad;});redrawInk();},750);
}
function silentRemove(objs){
  if(!objs||!objs.length)return;
  S.ink=S.ink.filter(function(o){return objs.indexOf(o)<0;});redrawInk();
}
var drawing=null,pid=null;
function pt(e){var r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/(r.width||1),y:(e.clientY-r.top)/(r.height||1)};}
function segDist(p,a,b){
  var dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy,t=l?((p.x-a.x)*dx+(p.y-a.y)*dy)/l:0;
  t=Math.max(0,Math.min(1,t));
  return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy));
}
function eraseAt(p){
  var px={x:p.x*cardW,y:p.y*cardH},rad=cellPx*0.4,changed=false;
  S.ink=S.ink.filter(function(s){
    if(s.step!==S.idx||s.bad||s.typed)return true;
    var pts=s.p.map(function(q){return {x:q.x*cardW,y:q.y*cardH};}),hit=false;
    if(pts.length===1)hit=Math.hypot(px.x-pts[0].x,px.y-pts[0].y)<rad;
    for(var i=1;i<pts.length&&!hit;i++)if(segDist(px,pts[i-1],pts[i])<rad)hit=true;
    if(hit)changed=true;
    return !hit;
  });
  if(changed)redrawInk();
}
function onPenDown(p){
  var st=cur();if(!writing(st))return;
  var T=targets(st),px={x:p.x*cardW,y:p.y*cardH},near=false,hit=null;
  T.forEach(function(t){
    if(!t.el)return;
    var rc=relRect(t.el);
    if(inRect({cx:px.x,cy:px.y},rc,0.5))hit=t;
    if(Math.hypot(px.x-(rc.x+rc.w/2),px.y-(rc.y+rc.h/2))<cellPx*2.6)near=true;
  });
  if(hit)hit.el.classList.add('touching');

}
function clearTouching(){var l=document.querySelectorAll('.touching');for(var i=0;i<l.length;i++)l[i].classList.remove('touching');}
cv.addEventListener('pointerdown',function(e){

  var p=pt(e);

  S.ink=S.ink.filter(function(s){return !(s.typed&&s.step===S.idx);});

cv.addEventListener('pointermove',function(e){

    ctx.lineCap='round';ctx.lineWidth=lineW();ctx.strokeStyle='#2A2F45';
    ctx.beginPath();ctx.moveTo(last.x*cardW,last.y*cardH);ctx.lineTo(p.x*cardW,p.y*cardH);ctx.stroke();
  }

function penUp(e){

cv.addEventListener('pointercancel',penUp);

var hereEl=null,hereTarget=null,hereTimer=null;

/* =========================================================
   手書きの判定
   ========================================================= */
function relRect(el){
  var r=el.getBoundingClientRect(),c=card.getBoundingClientRect();
  return {x:r.left-c.left,y:r.top-c.top,w:r.width,h:r.height};
}
function inRect(b,rc,k){
  var ex=k*rc.w,ey=k*Math.max(rc.h,cellPx*0.8);
  return b.cx>=rc.x-ex&&b.cx<=rc.x+rc.w+ex&&b.cy>=rc.y-ey&&b.cy<=rc.y+rc.h+ey;
}
function toPx(s){return s.p.map(function(q){return {x:q.x*cardW,y:q.y*cardH};});}
function mkRead(r){
  var top=r.cand[0];
  var o={top:top.d,dist:top.dist,conf:top.dist<=TH.maxDist};
  function idx(e){for(var i=0;i<r.cand.length;i++)if(r.cand[i].d===e)return i;return 99;}
  // 書こうとしている数字（e）と、まちがえやすい数字（rivals）をくらべる。
  // 8と9のようにまぎらわしいときは、決めつけずに「もう一度」と案内する。
  o.judge=function(e,rivals){
    var i=idx(e);if(i>=99)return 'no';
    var de=Math.max(r.cand[i].dist,1e-6),lo=RELAX?0.95:0.9,hi=RELAX?1.05:1.1,dr=1e9;
    (rivals||[]).forEach(function(x){var k=idx(x);if(k<99&&r.cand[k].dist<dr)dr=r.cand[k].dist;});
    if(dr<1e9){var ratio=dr/de;if(ratio<lo)return 'no';if(ratio<hi)return 'amb';}
    return o.accepts(e)?'ok':'no';
  };
  o.accepts=function(e){
    var i=idx(e);if(i>=99)return false;
    var ratio=RELAX?1.8:TH.accept,rank=RELAX?4:TH.rank,cap=TH.maxDist*(RELAX?1.5:1.2);
    return i<=rank&&r.cand[i].dist<=top.dist*ratio&&r.cand[i].dist<=cap;
  };
  return o;
}
function clusterize(objs){
  var pxs=objs.map(toPx),groups=HW.group(pxs),out=[],dust=[];
  groups.forEach(function(g){
    var members=g.strokes.map(function(px){return objs[pxs.indexOf(px)];});
    var size=Math.max(g.b.w,g.b.h);
    if(size<cellPx*TH.dust){dust=dust.concat(members);return;}
    var r=HW.recognize(g.strokes);
    out.push({objs:members,b:g.b,read:r?mkRead(r):null});
  });
  return {cl:out,dust:dust};
}
function flat(cls){var r=[];cls.forEach(function(c){r=r.concat(c.objs);});return r;}

function rivalsFor(st,e){
  var out=[];
  function add(n){if(n<0)return;dset(n).forEach(function(d){if(d!==e&&out.indexOf(d)<0)out.push(d);});}
  if(st.type==='mul'){add(st.A+st.B);add(st.base);if(st.cin>0)add(st.cin);add(st.A);add(st.B);}
  else if(st.type==='carry'){add(st.v%10);add(st.cout+1);add(st.cout-1);}
  else if(st.type==='add'){if(st.has0)add(st.x);if(st.has1)add(st.y);if(st.cin>0){add((st.x+st.y)%10);add(st.cin);}}
  
  return out;
}
function tName(t){return PLACE[colOfKey(t.key)]||'ここ';}
function boardWrong(st,c,T,missing){
  var d=c.read.top,kind=c.bad.kind,pt=(missing[0]||T[0]).el;
  if(kind==='multi') return {text:(T.length>1?'ひとつの マスには':'ここには')+' 1つの数字だけ書くよ。'+(st.type==='mul'&&!st.last&&st.v>=10?st.v+'の一の位を書こう。':''),point:pt};
  if(kind==='place'){
    var hit=null;T.forEach(function(t){if(t.val===d&&!hit)hit=t;});
    if(hit) return {text:d+'は、'+(st.type==='carry'||st.type==='addcarry'?'小さく上に':tName(hit)+'に')+'書こう。',point:hit.el};
    if(st.type==='mul'&&!st.last&&st.cout>0&&d===st.cout) return {text:d+'は、あとで 小さく上に書くよ。今は '+tName(T[0])+'だよ。',point:pt};
    if(st.type==='carry') return {text:'繰り上がりは、ここやで！',point:pt};
    return {text:(T.length>1?'答えは':'ここに書く')+'、ここやで！',point:pt};
  }
  // 数字そのものがちがう
  switch(st.type){
    case 'mul':{
      var mc=PLACE[Math.min(st.i,2)]+'の掛け算';
      if(d===st.A+st.B||d===(st.A+st.B)%10) return {text:'たすのではなく、かけ算だよ。'+st.A+'×'+st.B+'を考えよう。',add:true};
      if(st.cin>0&&dset(st.base).indexOf(d)>=0) return {text:'上の小さな'+st.cin+'を使おう。'+st.base+'と '+st.cin+'を合わせよう。'};
      if(M.n===2){
        var other=M.B[1-st.r];
        if(dset(st.A*other).indexOf(d)>=0) return {text:st.r===1?'今は かける数の十の位の'+M.B[1]+'だよ。':'今は かける数の一の位の'+M.B[0]+'だよ。'};
      }
      if(!st.last&&st.v>=10&&d===st.cout) return {text:d+'は 十の位の数だよ。'+PLACE[st.i+st.r]+'には '+st.v+'の 一の位を書こう。'};
      if(d===st.A||d===st.B) return {text:'かける前の数ではなく、'+st.A+'×'+st.B+'の答えを 見てみよう。'};
      return {text:st.A+'×'+st.B+'を考えよう。'+st.B+'の段を思い出そう。'};}
    case 'carry':
      if(d===st.v%10) return {text:d+'は もう 答えに書いたよ。十の位の'+st.cout+'を、小さく上に書こう。'};
      return {text:st.v+'の 十の位の数を、小さく上に書こう。'};
    case 'add':
      if(st.cin>0&&d===(st.x+st.y)%10) return {text:'上の小さな'+st.cin+'（くり上がり）も たそう。'};
      if(d===st.x||d===st.y) return {text:'たし算だよ。上と下の数を たそう。'};
      return {text:(st.has0&&st.has1?st.x+'＋'+st.y+(st.cin>0?'＋'+st.cin:''):'この位の数')+'を たそう。'};
    case 'addcarry': return {text:'くり上がりは 1だよ。となりの上に 小さく書こう。'};
  }
  return {text:'もう一度 考えてみよう。'};
}
function judgeBoard(st,objs){
  var T=targets(st),cr=clusterize(objs),cl=cr.cl;
  if(!cl.length)return {act:'none',dust:cr.dust};
  if(cl.some(function(c){return !c.read;}))return {act:'unread',remove:flat(cl),dust:cr.dust};
  T.forEach(function(t){t.rect=relRect(t.el);});
  var byT={};
  cl.forEach(function(c){
    var best=null,bd=1e9;
    T.forEach(function(t){
      if(inRect(c.b,t.rect,0.5)){
        var dd=Math.hypot(c.b.cx-(t.rect.x+t.rect.w/2),c.b.cy-(t.rect.y+t.rect.h/2));
        if(dd<bd){bd=dd;best=t;}
      }
    });
    c.tgt=best;
    if(best)(byT[best.key]=byT[best.key]||[]).push(c);
  });
  cl.forEach(function(c){
    if(!c.tgt){if(!c.read.conf)c.unr=true;else c.bad={kind:'place'};return;}
    if(byT[c.tgt.key].length>1){c.bad={kind:'multi'};return;}
    var s=c.read.judge(c.tgt.val,rivalsFor(st,c.tgt.val));
    if(s==='ok'){c.good=true;return;}
    if(s==='amb'||!c.read.conf){c.unr=true;return;}
    c.bad={kind:'digit'};
  });
  function teachOf(list){return list.filter(function(c){return c.tgt;}).map(function(c){return {val:c.tgt.val,strokes:c.objs.map(toPx)};});}
  var unr=cl.filter(function(c){return c.unr;});
  if(unr.length)return {act:'unread',remove:flat(unr),dust:cr.dust,teach:teachOf(unr)};
  var bads=cl.filter(function(c){return c.bad;}),goods=cl.filter(function(c){return c.good;}),cov={};
  goods.forEach(function(c){cov[c.tgt.key]=true;});
  var missing=T.filter(function(t){return !cov[t.key];});
  if(!bads.length){
    if(!missing.length)return {act:'solve',dust:cr.dust};
    return {act:'partial',point:missing[0].el,dust:cr.dust,msg:'いいね！もうひとつ、ここやで！'};
  }
  var w=boardWrong(st,bads[0],T,missing),k0=bads[0].bad.kind;
  var r={act:'wrong',teach:teachOf(bads.filter(function(c){return c.bad.kind==='digit';})),cat:catOf(st,k0),detail:'「'+bads[0].read.top+'」と読んだ'+(w.add?'（たし算かも）':''),
    spec:w.text+(k0==='digit'?'（「'+bads[0].read.top+'」と読んだよ）':''),point:w.point,remove:flat(bads),dust:cr.dust};
  if(!missing.length&&bads.every(function(c){return c.bad.kind==='place';}))r.act='solveNote';
  return r;
}

function showHint(st,spec){
  var lv=S.lv[S.idx]||0,hs=hintsFor(st),parts=[];
  if(spec)parts.push(spec);else if(lv===1)parts.push(hs.l1);
  if(lv>=2)parts.push(hs.l2);
  if(lv>=3){S.detail=true;parts.push('かいせつを 先生と いっしょに 見てみよう。');}
  S.fb={kind:'hint',text:parts.join(' '),anchor:anchorKey()};
  renderReact();renderDetail();
}
function giveHint(){
  var st=cur();if(!writing(st))return;
  S.lv[S.idx]=Math.min(3,(S.lv[S.idx]||0)+1);
  showHint(st,null);
}
function logMistake(cat,detail){
  if(!cat)return;
  stats[cat]=(stats[cat]||0)+1;S.mis++;
  mistakes.push({p:M.a+'×'+M.b,cat:cat,detail:detail});
}
function solveStep(note){
  clearTimeout(S.evalTimer);clearTimeout(S.waitTimer);clearHere();
  var st=cur(),T0=st.targets,key=T0.length?T0[T0.length-1].key:'pp-0-0';
  S.idx++;S.detail=false;S.teach=null;
  S.fb={kind:'ok',text:okText(st)+(note?' '+note:''),anchor:key};
  renderAll();
}
function applyResult(st,res){
  silentRemove(res.dust);
  var k=S.idx;
  S.teach=(res.teach&&res.teach.length)?{step:k,items:res.teach}:null;
  switch(res.act){
    case 'none':redrawInk();return;
    case 'unread':
      S.unread[k]=(S.unread[k]||0)+1;stats.unread++;
      flashRemove(res.remove);
      S.fb={kind:'hint',text:UNREAD_MSG,anchor:anchorKey()};renderReact();return;
    case 'partial':
      S.fb={kind:'ok',text:res.msg,anchor:anchorKey()};renderReact();showHere(res.point,'ここやで！');return;
    case 'wrong':
      S.lv[k]=Math.min(3,(S.lv[k]||0)+1);
      logMistake(res.cat,res.detail);
      flashRemove(res.remove);
      if(res.point)showHere(res.point,'ここやで！');
      showHint(st,res.spec);return;
    case 'solve':solveStep('');return;
    case 'solveNote':logMistake('答えの数字の配置','ちがう場所にも書いた');solveStep('（'+res.spec+'）');return;
  }
}
function evaluate(force){
  clearTimeout(S.evalTimer);clearTimeout(S.waitTimer);
  var st=cur();if(!writing(st))return;
  var objs=S.ink.filter(function(s){return s.step===S.idx&&!s.bad&&!s.typed;});
  if(!objs.length)return;
  layoutMeasure();
  RELAX=(S.unread[S.idx]||0)>=2;
  applyResult(st,judgeBoard(st,objs));
}

/* =========================================================
   ボタン類
   ========================================================= */
function undo(){
  var i=S.ink.length-1;
  while(i>=0&&S.ink[i].bad)i--;
  if(i<0)return;
  var s=S.ink.splice(i,1)[0];
  if(s.step<S.idx)S.idx=s.step;
  S.fb=null;S.detail=false;renderAll();
}
function clearStep(){
  S.ink=S.ink.filter(function(s){return s.step!==S.idx;});
  S.fb=null;redrawInk();renderReact();
}
var restartTimer=null;
function restart(){
  var b=$('#bRestart');
  if(!restartTimer){
    b.innerHTML='<span class="ic">❓</span>ほんとに？';
    restartTimer=setTimeout(function(){restartTimer=null;b.innerHTML='<span class="ic">🔄</span>はじめ<br>から';},3000);
    return;
  }
  clearTimeout(restartTimer);restartTimer=null;
  b.innerHTML='<span class="ic">🔄</span>はじめ<br>から';
  startProblem(M.a,M.b);
}
function newRandom(){var p=genProblem(cfg.type,cfg.cm);startProblem(p.a,p.b);}
function teacherHTML(){
  var m=M,h='';
  h+='<h2>かけ算の意味</h2><p>'+m.a+'×'+m.b+'は「'+m.a+'を'+m.b+'回たす」ことでも表せます。ひっ算では、位ごとに分けて、<b>一の位から</b>順に かけて、答えを合わせます。</p>';
  h+='<h2>この問題の解き方（先生用）</h2><ol>';
  m.steps.forEach(function(s){
    if(s.type==='mul')h+='<li>'+(m.n===2?'かける数の'+PLACE[s.r]+'の'+s.B+'：':'')+PLACE[s.i]+'：'+s.A+'×'+s.B+(s.cin>0?'＋繰り上がり'+s.cin:'')+'＝'+s.v+(s.last?'':(s.v>=10?' → '+(s.v%10)+'を書く':' → '+s.v+'を書く'))+(s.r===1&&s.i===0?'（ひとつ左のマスから）':'')+'</li>';
    else if(s.type==='carry')h+='<li>繰り上がり '+s.cout+' を 上に小さく書く</li>';
    else if(s.type==='add')h+='<li>たし算（'+PLACE[s.c]+'）：'+(s.has0?s.x:'')+(s.has0&&s.has1?'＋':'')+(s.has1?s.y:'')+(s.cin>0?'＋'+s.cin:'')+'＝'+s.v+'</li>';
    else if(s.type==='addcarry')h+='<li>たし算の繰り上がり '+s.cout+' を 上に小さく書く</li>';
  });
  h+='<li>答え：'+m.ans+'</li></ol>';
  h+='<h2>問題を自分で決める</h2><p>かけられる数（10〜999）×かける数（2〜99・0を含まない）<br><input id="cA" type="number" inputmode="numeric" min="10" max="999" style="width:6rem;font-size:1.2rem"> × <input id="cB" type="number" inputmode="numeric" min="2" max="99" style="width:5rem;font-size:1.2rem"> <button class="btn small" data-act="custom">この問題にする</button> <span id="cMsg" style="color:#B45309"></span></p>';
  h+='<h2>手書き数字の読み取りについて</h2><p>書いた線をこの端末の中だけで読み取っています（点の並びを、0〜9の見本と比べる方法。外部サービスは使いません）。書いた場所がマス目のどこにあたるかも見ています。確かでないときは、まちがいと決めつけず「うまく読めなかったよ」と案内します。同じ場所で2回続けて読めないと、読み取りをさらに甘くして、「先生が OK にする」ボタンも出します。</p>';
  h+='<h2>おぼえさせた字</h2><p>「先生が OK にする」を押すと、そのときの字を おぼえて、つぎから読みやすくなります（この端末の中だけに保存）。いま <b>'+HW.sampleCount()+'</b> こ。 <button class="btn small" data-act="forget">ぜんぶ わすれさせる</button></p>';
  h+='<h2>つまずきメモ（この画面を開いている間だけ）</h2><div class="cats">';
  Object.keys(stats).forEach(function(c){if(c==='unread')return;h+='<span class="cat'+(stats[c]>0?' has':'')+'">'+c+(stats[c]>0?' ×'+stats[c]:'')+'</span>';});
  h+='<span class="cat'+(stats.unread>0?' has':'')+'">読めなかった'+(stats.unread>0?' ×'+stats.unread:'')+'</span></div><ul class="mlog">';
  var last=mistakes.slice(-6).reverse();
  last.forEach(function(x){h+='<li>'+x.p+'：'+x.cat+'（'+x.detail+'）</li>';});
  if(!last.length)h+='<li>まだ まちがいは ありません。</li>';
  h+='</ul><p class="privacy">名前などは保存しません。記録は画面を閉じると消えます。</p>';
  h+='<p><button class="btn" data-act="closeDrawer">とじる</button></p>';
  return h;
}
/* ---- 字をおぼえさせる画面（0〜9を自分の字で登録） ---- */
var cal={strokes:{},cur:null};
function calRedraw(cvx){
  if(!cvx)return;
  var d=cvx.getAttribute('data-d'),c=cvx.getContext('2d'),r=cvx.getBoundingClientRect(),dp=cvx.width/Math.max(r.width,1);
  c.setTransform(dp,0,0,dp,0,0);c.clearRect(0,0,r.width,r.height);
  c.lineCap='round';c.lineJoin='round';c.lineWidth=6;c.strokeStyle='#2A2F45';
  (cal.strokes[d]||[]).forEach(function(st){c.beginPath();st.forEach(function(p,i){if(i)c.lineTo(p.x,p.y);else c.moveTo(p.x,p.y);});c.stroke();});
}
function openCalib(){
  var h='<h2>字を おぼえさせる</h2><p>0〜9を、いつもの書き方で 書いて「おぼえる」を おしてね。読み違える数字（たとえば 6）は、2〜3回 おぼえさせると 読みやすくなります。（この端末の中だけに保存）</p><div class="calg">';
  for(var d=0;d<10;d++){
    h+='<div class="calcell"><div class="calnum">'+d+' <small id="cc'+d+'">('+HW.sampleCountOf(d)+')</small></div><canvas class="calcv" data-d="'+d+'"></canvas>'+
       '<div class="calbt"><button class="btn small" data-act="calclr" data-d="'+d+'">けす</button><button class="btn small" data-act="calok" data-d="'+d+'">おぼえる</button></div></div>';
  }
  h+='</div><p><button class="btn" data-act="closeDrawer">とじる</button></p>';
  var sh=$('#sheet');sh.innerHTML=h;sh.classList.add('wide');
  $('#drawer').hidden=false;drawerMode='calib';cal.strokes={};
  var cs=sh.querySelectorAll('.calcv'),dp=Math.min(window.devicePixelRatio||1,2.5);
  for(var i=0;i<cs.length;i++){var r=cs[i].getBoundingClientRect();cs[i].width=Math.round(r.width*dp);cs[i].height=Math.round(r.height*dp);calRedraw(cs[i]);}
}
document.addEventListener('pointerdown',function(e){
  var t=e.target;if(!t||!t.classList||!t.classList.contains('calcv'))return;
  e.preventDefault();var d=t.getAttribute('data-d'),r=t.getBoundingClientRect();
  try{t.setPointerCapture(e.pointerId);}catch(_){}
  (cal.strokes[d]=cal.strokes[d]||[]).push([{x:e.clientX-r.left,y:e.clientY-r.top}]);cal.cur=t;calRedraw(t);
});
document.addEventListener('pointermove',function(e){
  var t=cal.cur;if(!t)return;
  var d=t.getAttribute('data-d'),r=t.getBoundingClientRect(),a=cal.strokes[d];
  if(a&&a.length){a[a.length-1].push({x:e.clientX-r.left,y:e.clientY-r.top});calRedraw(t);}
});
document.addEventListener('pointerup',function(){cal.cur=null;});
document.addEventListener('pointercancel',function(){cal.cur=null;});
function startProblem(a,b){
  M=makeModel(a,b);M.cp=cfg.cp;
  S={idx:0,ink:[],fb:null,lv:{},unread:{},tool:'pen',mis:0,detail:false,evalTimer:null,waitTimer:null};
  renderAll();
}

/* =========================================================
   イベント
   ========================================================= */
document.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('[data-act]'):null;
  if(!t){if(e.target===$('#drawer')){$('#drawer').hidden=true;drawerMode='';$('#sheet').classList.remove('wide');}return;}
  var act=t.getAttribute('data-act');
  if(act==='pen'){S.tool='pen';renderTools();}
  else if(act==='eraser'){S.tool='erase';renderTools();}
  else if(act==='hint')giveHint();
  else if(act==='pad'){padOn=!padOn;renderPad();}
  else if(act==='num')pressNum(parseInt(t.getAttribute('data-d'),10));
  else if(act==='numdel')numDel();
  else if(act==='numclear')numClear();
  else if(act==='kb'){var ki=$('#kbIn');if(ki)ki.focus();}
  else if(act==='calib')openCalib();
  else if(act==='calclr'){var d0=t.getAttribute('data-d');cal.strokes[d0]=[];calRedraw(document.querySelector('.calcv[data-d="'+d0+'"]'));}
  else if(act==='calok'){
    var d1=t.getAttribute('data-d'),st1=cal.strokes[d1]||[];
    if(st1.length){HW.addSample(parseInt(d1,10),st1);saveSamples();cal.strokes[d1]=[];calRedraw(document.querySelector('.calcv[data-d="'+d1+'"]'));var cc=$('#cc'+d1);if(cc)cc.textContent='('+HW.sampleCountOf(parseInt(d1,10))+')';}
  }
  else if(act==='undo')undo();
  else if(act==='clearStep')clearStep();
  else if(act==='restart')restart();
  else if(act==='gen'){cfg.type=t.getAttribute('data-t');newRandom();}
  else if(act==='cm'){cfg.cm=t.getAttribute('data-v');saveCfg();renderPick();}
  else if(act==='cp'){cfg.cp=t.getAttribute('data-v');saveCfg();startProblem(M.a,M.b);}
  else if(act==='nextProblem')newRandom();
  else if(act==='teacherOk'){
    var note='（先生が OK にしました）';
    if(S.teach&&S.teach.step===S.idx){
      S.teach.items.forEach(function(it){HW.addSample(it.val,it.strokes);});
      saveSamples();note='（先生が OK にしました。この字を おぼえたよ）';
    }
    solveStep(note);
  }
  else if(act==='forget'){HW.clearSamples();saveSamples();$('#sheet').innerHTML=teacherHTML();}
  else if(act==='closeDetail'){S.detail=false;renderDetail();}
  else if(act==='drawer'){$('#sheet').classList.remove('wide');$('#sheet').innerHTML=teacherHTML();$('#drawer').hidden=false;drawerMode='teacher';}
  else if(act==='closeDrawer'){$('#drawer').hidden=true;drawerMode='';$('#sheet').classList.remove('wide');}
  else if(act==='custom'){
    var a=parseInt($('#cA').value,10),b=parseInt($('#cB').value,10),msg=$('#cMsg');
    if(!(a>=10&&a<=999)||!(b>=2&&b<=99)||String(b).indexOf('0')>=0){msg.textContent='数を 見なおしてね（かける数に0は つかえません）';return;}
    cfg.type=(String(a).length===2?'2':'3')+'x'+String(b).length;
    $('#drawer').hidden=true;drawerMode='';startProblem(a,b);
  }
  else if(act==='big'){document.documentElement.classList.toggle('big');renderAll();}
});
document.addEventListener('input',function(e){
  if(!e.target||e.target.id!=='kbIn')return;
  var v=String(e.target.value).replace(/[^0-9]/g,'');e.target.value='';
  v.split('').forEach(function(ch){pressNum(parseInt(ch,10));});
});
document.addEventListener('keydown',function(e){
  if(e.target&&e.target.id==='kbIn'&&e.key==='Backspace'){numDel();e.preventDefault();return;}
  if(!S||!writing(cur()))return;
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))return;
  if(/^[0-9]$/.test(e.key)){pressNum(parseInt(e.key,10));e.preventDefault();}
  else if(e.key==='Backspace'){numDel();e.preventDefault();}
});
['gesturestart','gesturechange','gestureend'].forEach(function(ev){
  document.addEventListener(ev,function(e){e.preventDefault();});
});
var rzTimer=null;
window.addEventListener('resize',function(){clearTimeout(rzTimer);rzTimer=setTimeout(function(){if(S)renderAll();},150);});

/* =========================================================
   起動：ランダムな 2けた×1けた から
   ========================================================= */
newRandom();
})();
</script>
