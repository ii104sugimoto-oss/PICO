<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<base target="_top">
<title>ひっ算</title>
<style>
:root{
  --page:#E8F2EE; --paper:#FBFDFC; --grid:#CFE5DF; --grid2:#9DBFB6;
  --ink:#22304A; --ink-soft:#5F6F88; --pencil:#2A2F45;
  --ones:#2468E0; --ones-bg:#DCE8FF;
  --tens:#E8821A; --tens-bg:#FFE9CF;
  --huns:#1F9D5A; --huns-bg:#D6F2E3;
  --carry:#D6336C; --carry-bg:#FFE0EC;
  --ok:#1F8A52; --ok-bg:#DDF5E8; --hint:#9A4A00; --hint-bg:#FFF1CC;
  --mark:#FFE680;
  --cell:clamp(5rem,min(20vh,calc((75vw - 16rem)/3.6)),11rem);
  --bw:12.5rem;
  --sign:calc(var(--cell)*.55);
  --font:"UD Digi Kyokasho N-R","UD デジタル 教科書体 N-R","BIZ UDPGothic","Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
}
@media (orientation:portrait){:root{--cell:clamp(5rem,min(14vh,calc((100vw - 18rem)/3.6)),11rem)}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:16px;-webkit-text-size-adjust:100%}
html.big{font-size:19px}
body{
  margin:0;background:var(--page);color:var(--ink);font-family:var(--font);line-height:1.5;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
button,select{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--ones);outline-offset:2px}

/* ---------- 全体レイアウト（10.1〜10.5インチ・横向きを基本に、縦向きにも対応） ---------- */
.app{
  height:100vh;height:100dvh;padding:.5rem;display:grid;gap:.5rem;
  grid-template-columns:minmax(0,1fr) clamp(13rem,18vw,17rem);
  grid-template-rows:minmax(0,1fr);
  grid-template-areas:"paper guide";
}
@media (orientation:portrait){
  .app{
    grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;
    grid-template-areas:"paper" "guide";
  }
}
.a-paper{grid-area:paper;min-height:0}.a-guide{grid-area:guide;min-height:0}
.head-tools{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.chip{border:2.5px solid var(--ink);background:#fff;border-radius:999px;padding:.15rem .6rem;font-size:.95rem;font-weight:700;min-height:2.3rem}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip.tool{border-color:var(--ink-soft);color:var(--ink-soft);font-size:.9rem}

/* ---------- 筆算用紙（方眼ノート） ---------- */
.card{
  position:relative;height:100%;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:1.6rem 1.6rem;
  border:3px solid var(--ink);border-radius:1.2rem;padding:.4rem .5rem;
  display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:.6rem;
}
.bcol{flex:1 1 auto;min-width:11rem;align-self:stretch}
.dock{position:relative;z-index:6;flex:none;display:flex;flex-direction:column;gap:.35rem;align-self:center}
.dbtn{width:4.4rem;min-height:3.9rem;border-radius:.9rem;background:#fff;border:3px solid var(--ink);box-shadow:0 .18rem 0 var(--ink);font-size:.72rem;font-weight:700;line-height:1.15;padding:.15rem}
.dbtn .ic{display:block;font-size:1.4rem;line-height:1.2}
.dbtn:active{transform:translateY(.15rem);box-shadow:0 .03rem 0 var(--ink)}
.dbtn[aria-pressed="true"]{background:var(--ink);color:#fff}
#bubbles{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:4}
#ink{position:absolute;left:0;top:0;width:100%;height:100%;z-index:5;touch-action:none;border-radius:1.1rem;cursor:crosshair}
#ink.off{pointer-events:none}
.board{display:grid;justify-content:center;column-gap:.3rem;
  grid-template-rows:auto calc(var(--cell)*.95) var(--cell) var(--cell) .55rem calc(var(--cell)*1.2)}
.cell{position:relative;display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--cell)*.74);font-weight:700;line-height:1;border-radius:.8rem;
  transition:background .25s,opacity .25s,box-shadow .25s}
.p-o{color:var(--ones)}.p-t{color:var(--tens)}.p-h{color:var(--huns)}
.sign,.mult{color:var(--ink)}
.sign{font-size:calc(var(--cell)*.6)}
.rule{align-self:center;height:.38rem;background:var(--ink);border-radius:.2rem}
.dim{opacity:.3}
.circ{position:absolute;left:-.45rem;top:-.45rem;width:calc(100% + .9rem);height:calc(100% + .9rem);overflow:visible;pointer-events:none;transform:rotate(-5deg)}
.circ ellipse{fill:none;stroke-width:5;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;animation:draw .9s ease-out .1s forwards}
.circ.c-on ellipse{stroke:var(--ones)}.circ.c-tn ellipse{stroke:var(--tens)}.circ.c-cy ellipse{stroke:var(--carry)}
@keyframes draw{to{stroke-dashoffset:0}}
.bub2{position:absolute;background:#fff;border:3px solid var(--ones);border-radius:1.1rem;padding:.5rem .7rem;font-size:1.15rem;font-weight:700;line-height:1.4;box-shadow:0 .2rem .5rem rgba(0,0,0,.12)}
.bub2 small{display:block;font-size:.85rem;font-weight:400;color:var(--ink-soft);margin-top:.2rem}
.bub2::before{content:"";position:absolute;left:-.95rem;top:calc(var(--ty,1.5rem) - .6rem);border:.6rem solid transparent;border-right:.8rem solid var(--ones);border-left:0}
.bub2::after{content:"";position:absolute;left:-.62rem;top:calc(var(--ty,1.5rem) - .5rem);border:.5rem solid transparent;border-right:.65rem solid #fff;border-left:0}
.bub2.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.bub2.ok::before{border-right-color:var(--ok)}.bub2.ok::after{border-right-color:var(--ok-bg)}
.bub2.hint{border-color:#E0A33A;background:var(--hint-bg);color:var(--hint);animation:shake .4s}
.bub2.hint::before{border-right-color:#E0A33A}.bub2.hint::after{border-right-color:var(--hint-bg)}
.bub2.say{color:var(--ink)}
.hdr{font-size:.85rem;font-weight:700;border-radius:.7rem;padding:.15rem .1rem;margin-bottom:.3rem;white-space:nowrap;position:relative;opacity:.5}
.hdr.p-o{background:var(--ones-bg)}.hdr.p-t{background:var(--tens-bg)}.hdr.p-h{background:var(--huns-bg)}
.hdr.on{opacity:1;color:#fff}.hdr.on.p-o{background:var(--ones)}.hdr.on.p-t{background:var(--tens)}.hdr.on.p-h{background:var(--huns)}
.hdr .arr{position:absolute;right:-.7rem;top:50%;transform:translateY(-50%);font-size:1rem;color:var(--ink-soft);opacity:.45}
.hdr.on .arr{color:var(--tens);opacity:1}

/* 書く場所（マス目） */
.slot{border:.25rem dashed var(--grid2);background:rgba(255,255,255,.55)}
.slot .ghost{display:none;font-size:calc(var(--cell)*.22);font-weight:700;opacity:.7;position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;line-height:1.2}
.slot.target .ghost{display:block}
.slot.target{animation:blink 1.4s ease-in-out infinite;background:rgba(255,255,255,.9)}
.slot.target.p-o{border-color:var(--ones);color:var(--ones)}
.slot.target.p-t{border-color:var(--tens);color:var(--tens)}
.slot.target.p-h{border-color:var(--huns);color:var(--huns)}
.slot.carry-slot{border-color:#E6B5C9;border-radius:.6rem}
.slot.carry-slot.target{border-color:var(--carry);color:var(--carry);background:var(--carry-bg)}
.slot.carry-slot .ghost{font-size:calc(var(--cell)*.18)}
.slot.touching{box-shadow:0 0 0 .25rem #7BD39F;background:var(--ok-bg)}
.slot.used .tick{position:absolute;right:.1rem;top:-.1rem;font-size:calc(var(--cell)*.2);color:var(--ok);background:#fff;border-radius:.4rem;padding:0 .2rem}
.final{animation:glow 1.6s ease-in-out infinite alternate}
@keyframes blink{50%{box-shadow:0 0 0 .3rem rgba(255,230,128,.9)}}
@keyframes glow{to{box-shadow:0 0 0 .25rem #FFD54A;background:#FFF6CC}}

.c-o{color:var(--ones);font-weight:700}.c-t{color:var(--tens);font-weight:700}.c-h{color:var(--huns);font-weight:700}.c-c{color:var(--carry);font-weight:700}

/* ---------- 右側：今やること・反応・道具 ---------- */
.a-guide{display:flex;flex-direction:column;gap:.5rem;overflow:auto;-webkit-overflow-scrolling:touch}
.panel{background:#fff;border:3px solid var(--ink);border-radius:1.2rem;padding:.7rem .9rem}
.now .dots{display:flex;gap:.35rem;margin-bottom:.35rem}
.now .dot{width:.85rem;height:.85rem;border-radius:50%;border:2.5px solid var(--ink-soft);background:#fff}
.now .dot.done{background:var(--ok);border-color:var(--ok)}
.now .dot.cur{background:var(--mark);border-color:var(--ink);transform:scale(1.25)}
.now-main{display:flex;align-items:center;gap:.5rem;font-size:1.3rem;word-break:auto-phrase;line-break:strict;font-weight:700;line-height:1.25}
.now-main .num{flex:none;font-size:2.4rem;color:var(--ink)}
.now-say{font-size:1.3rem;font-weight:700;margin:.25rem 0 0}
.now-sub{font-size:1.05rem;color:var(--ink-soft);margin:.1rem 0 0}
.react{min-height:4.6rem;display:flex;flex-direction:column;justify-content:center;gap:.4rem;font-size:1.2rem;font-weight:700}
.react.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.react.hint{background:var(--hint-bg);border-color:#E0A33A;color:var(--hint);animation:shake .4s}
.react.idle{color:var(--ink-soft);font-weight:400}
@keyframes shake{20%{transform:translateX(-.4rem)}50%{transform:translateX(.4rem)}80%{transform:translateX(-.2rem)}}
.detail{font-size:1.05rem;border-color:var(--ones);background:#F4F8FF;max-height:14rem;overflow:auto}
.detail h3{margin:0 0 .3rem;font-size:1.1rem;color:var(--ones)}
.detail p{margin:.25rem 0}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:.45rem}
select#probSel{font-size:1.2rem;font-weight:700;padding:.3rem .6rem;border:3px solid var(--ink);border-radius:.9rem;background:#fff;min-height:2.6rem}
.tools+.btn,.btn.block{display:block;width:100%}
@media (orientation:portrait){.tools{grid-template-columns:repeat(6,1fr)}.tbtn{font-size:.8rem}.tbtn .ic{font-size:1.2rem}}
.tbtn{font-size:1rem;font-weight:700;min-height:3.6rem;border-radius:1rem;background:#fff;border:3px solid var(--ink);box-shadow:0 .22rem 0 var(--ink);padding:.2rem .3rem;line-height:1.2}
.tbtn:active{transform:translateY(.18rem);box-shadow:0 .04rem 0 var(--ink)}
.tbtn[aria-pressed="true"]{background:var(--ink);color:#fff}
.tbtn .ic{display:block;font-size:1.4rem}
.btn{font-size:1.2rem;font-weight:700;padding:.6rem 1rem;border-radius:1rem;background:var(--ones);color:#fff;border:3px solid var(--ink);box-shadow:0 .22rem 0 var(--ink)}
.btn.small{font-size:.95rem;padding:.35rem .8rem;background:#fff;color:var(--ink);align-self:flex-start}
.praise{font-size:1.15rem;font-weight:400;margin:.3rem 0 .5rem}

/* ここやで */
.here{position:fixed;z-index:60;pointer-events:none;display:flex;flex-direction:column;align-items:center;animation:hop .7s ease-in-out infinite}
.here .bub{background:var(--carry);color:#fff;font-weight:700;font-size:1.4rem;padding:.25rem .9rem;border-radius:999px;border:3px solid #fff;box-shadow:0 .2rem .6rem rgba(0,0,0,.25);white-space:nowrap}
.here .tip{font-size:1.8rem;line-height:1;color:var(--carry);text-shadow:0 0 .2rem #fff}
@keyframes hop{50%{margin-top:-.5rem}}
.here-target{outline:.35rem solid var(--carry);outline-offset:.1rem}

/* きろく・かいせつ */
.drawer{position:fixed;inset:0;z-index:70;background:rgba(34,48,74,.45);display:flex;justify-content:center;align-items:flex-start;padding:1rem;overflow:auto}
.drawer[hidden]{display:none}
.drawer .sheet{background:#fff;border:3px solid var(--ink);border-radius:1.2rem;max-width:44rem;width:100%;padding:1rem 1.2rem}
.sheet h2{font-size:1.2rem;margin:.8rem 0 .4rem}
.sheet h2:first-child{margin-top:0}
.sheet p,.sheet li{margin:.25rem 0}
.sheet ul{margin:0;padding-left:1.2rem}
.cats{display:flex;flex-wrap:wrap;gap:.4rem}
.cat{font-size:.95rem;padding:.2rem .7rem;border-radius:999px;background:#EEF2F6;color:var(--ink-soft);font-weight:700}
.cat.has{background:var(--hint-bg);color:var(--hint)}
.mlog{font-size:.95rem;color:var(--ink-soft)}
.privacy{font-size:.85rem;color:var(--ink-soft)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<noscript>JavaScriptを有効にしてください。</noscript>
<div class="app">

  <section class="a-paper">
    <div class="card" id="paper" aria-label="ひっ算ようし。ゆびやペンで 数字を書こう">
      <div class="dock">
        <button class="dbtn" data-act="pen" id="bPen" aria-pressed="true"><span class="ic">✏️</span>えんぴつ</button>
        <button class="dbtn" data-act="eraser" id="bEraser" aria-pressed="false"><span class="ic">🧽</span>けしごむ</button>
        <button class="dbtn" data-act="hint"><span class="ic">💡</span>ヒント</button>
        <button class="dbtn" data-act="undo"><span class="ic">↩️</span>ひとつ<br>もどる</button>
        <button class="dbtn" data-act="clearStep"><span class="ic">🗑️</span>ぜんぶ<br>けす</button>
        <button class="dbtn" data-act="restart" id="bRestart"><span class="ic">🔄</span>はじめ<br>から</button>
      </div>
      <div id="board"></div>
      <div class="bcol" id="bcol"></div>
      <div id="bubbles" aria-live="polite"></div>
      <canvas id="ink"></canvas>
    </div>
  </section>

  <section class="a-guide">
    <div class="head-tools" id="chips"></div>
    <div class="panel now" id="now"></div>
    <button class="btn block" data-act="teacherOk" id="teacherOkBtn" hidden>先生が「OK」にする</button>
  </section>
</div>

<div class="drawer" id="drawer" hidden>
  <div class="sheet" id="sheet"></div>
</div>

<script>
(function(){
'use strict';

/*HW-START*/
var HW = (function(){
  var N = 40;
  function arc(cx,cy,rx,ry,a0,a1,n){
    var r=[]; n=n||20;
    for(var i=0;i<=n;i++){
      var a=(a0+(a1-a0)*i/n)*Math.PI/180;
      r.push([cx+rx*Math.cos(a), cy+ry*Math.sin(a)]);
    }
    return r;
  }
  function cat(){var r=[];for(var i=0;i<arguments.length;i++)r=r.concat(arguments[i]);return r;}

  // 数字の見本（0〜100 の枠の中。書き方のちがいを複数用意）
  var SHAPES = {
    0:[ [arc(50,50,30,45,270,630,36)], [arc(50,50,22,45,270,630,36)], [arc(50,50,38,44,300,660,36)] ],
    1:[ [[[50,5],[50,95]]], [[[30,28],[50,5],[50,95]]], [[[30,28],[50,5],[50,95]],[[28,95],[72,95]]] ],
    2:[ [cat(arc(50,32,28,27,185,395,14),[[22,93],[80,93]])],
        [cat(arc(50,32,28,27,185,395,14),[[22,93]])],
        [cat(arc(50,32,28,27,185,395,14),[[22,93]]),[[20,93],[80,93]]] ],
    3:[ [cat(arc(48,27,24,22,200,450,16),arc(48,71,28,23,270,520,18))],
        [cat([[22,8],[75,8],[45,45]],arc(48,71,28,23,270,520,18))] ],
    4:[ [[[62,5],[18,62],[85,62]],[[65,30],[65,95]]],
        [[[28,5],[22,58],[82,58]],[[66,5],[66,95]]],
        [[[62,5],[15,65],[88,65]],[[62,5],[62,95]]] ],
    5:[ [cat([[75,8],[30,8],[26,46]],arc(46,68,28,24,250,520,18))],
        [[[75,8],[30,8]],cat([[30,8],[26,46]],arc(46,68,28,24,250,520,18))] ],
    6:[ [cat([[66,5],[40,28],[28,55]],arc(50,70,26,25,170,530,22))],
        [cat([[62,5],[36,30],[24,62]],arc(50,70,26,25,180,540,22))] ],
    7:[ [[[20,8],[80,8],[40,95]]],
        [[[20,8],[80,8],[40,95]],[[32,52],[68,52]]],
        [cat([[18,14],[30,6],[80,8]],[[55,50],[38,95]])] ],
    8:[ [arc(50,27,21,21,0,360,18),arc(50,72,27,24,0,360,20)].map(function(s){return s;}),
        [cat(arc(50,28,22,21,320,90,18),arc(50,72,27,24,270,630,22))] ],
    9:[ [arc(50,30,26,24,0,360,22),[[76,30],[72,60],[55,95]]],
        [cat(arc(50,30,26,24,30,390,22),[[76,32],[74,65],[58,95]])],
        [arc(50,30,26,24,0,360,22),[[76,30],[76,95]]] ]
  };

  function dist(a,b){var dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy);}
  function pathLength(pts){
    var d=0;
    for(var i=1;i<pts.length;i++) if(pts[i].id===pts[i-1].id) d+=dist(pts[i-1],pts[i]);
    return d;
  }
  function resample(src,n){
    var pts=src.map(function(p){return {x:p.x,y:p.y,id:p.id};});
    var I=pathLength(pts)/(n-1), D=0, out=[pts[0]];
    if(!(I>0)) return null;
    for(var i=1;i<pts.length;i++){
      if(pts[i].id===pts[i-1].id){
        var d=dist(pts[i-1],pts[i]);
        if(D+d>=I){
          var t=(I-D)/d;
          var q={x:pts[i-1].x+t*(pts[i].x-pts[i-1].x), y:pts[i-1].y+t*(pts[i].y-pts[i-1].y), id:pts[i].id};
          out.push(q); pts.splice(i,0,q); D=0;
        }else D+=d;
      }
    }
    while(out.length<n){var l=out[out.length-1];out.push({x:l.x,y:l.y,id:l.id});}
    return out.slice(0,n);
  }
  function normalize(pts){
    var minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9,i;
    for(i=0;i<pts.length;i++){
      minx=Math.min(minx,pts[i].x);maxx=Math.max(maxx,pts[i].x);
      miny=Math.min(miny,pts[i].y);maxy=Math.max(maxy,pts[i].y);
    }
    var s=Math.max(maxx-minx,maxy-miny); if(s<1e-6) s=1;
    var cx=0,cy=0;
    var o=pts.map(function(p){return {x:(p.x-minx)/s,y:(p.y-miny)/s,id:p.id};});
    for(i=0;i<o.length;i++){cx+=o[i].x;cy+=o[i].y;}
    cx/=o.length;cy/=o.length;
    return o.map(function(p){return {x:p.x-cx,y:p.y-cy,id:p.id};});
  }
  function flatten(strokes){
    var r=[];
    strokes.forEach(function(s,si){s.forEach(function(p){r.push({x:p.x,y:p.y,id:si});});});
    return r;
  }
  function prep(strokes){
    strokes=strokes.map(function(st){
      var o=[];st.forEach(function(p){var l=o[o.length-1];if(!l||Math.abs(p.x-l.x)+Math.abs(p.y-l.y)>=0.8)o.push(p);});
      return o;
    });
    var f=flatten(strokes);
    if(f.length<2) return null;
    var r=resample(f,N);
    return r?normalize(r):null;
  }
  function cloudDist(a,b,start){
    var n=a.length, matched=new Array(n), i, j, sum=0, k=start;
    for(i=0;i<n;i++) matched[i]=false;
    do{
      var min=1e9, idx=-1;
      for(j=0;j<n;j++){
        if(!matched[j]){var d=dist(a[k],b[j]); if(d<min){min=d;idx=j;}}
      }
      matched[idx]=true;
      var w=1-((k-start+n)%n)/n;
      sum+=w*min;
      k=(k+1)%n;
    }while(k!==start);
    return sum;
  }
  function greedy(a,b){
    var n=a.length, step=Math.floor(Math.pow(n,0.5)), m=1e9;
    for(var i=0;i<n;i+=step){
      m=Math.min(m,cloudDist(a,b,i),cloudDist(b,a,i));
    }
    return m;
  }

  function aspect(strokes){
    var minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
    strokes.forEach(function(s){s.forEach(function(p){
      minx=Math.min(minx,p.x);maxx=Math.max(maxx,p.x);miny=Math.min(miny,p.y);maxy=Math.max(maxy,p.y);});});
    var w=maxx-minx,h=maxy-miny; if(h<1e-6) return 3;
    return Math.min(w/h,1.5);
  }
  var AR_W=0;
  var TEMPLATES=[];
  Object.keys(SHAPES).forEach(function(d){
    SHAPES[d].forEach(function(shape){
      var base=shape.map(function(s){return s.map(function(p){return {x:p[0],y:p[1]};});});
      // 書き方のちがい（ななめ・細い・太い）も見本にする
      [[0,1],[0.22,1],[-0.22,1],[0,0.72],[0,1.3]].forEach(function(v){
        var strokes=base.map(function(s){return s.map(function(p){return {x:(p.x-50+v[0]*(p.y-50))*v[1]+50,y:p.y};});});
        var t=prep(strokes);
        if(t) TEMPLATES.push({d:parseInt(d,10),pts:t,ar:aspect(strokes)});
      });
    });
  });

  // strokes: [[{x,y}...],...] → 数字ごとの距離（小さいほど似ている）
  function recognize(strokes){
    var p=prep(strokes);
    if(!p) return null;
    var best={}, ar=aspect(strokes);
    TEMPLATES.forEach(function(t){
      var d=greedy(p,t.pts)+AR_W*Math.abs(ar-t.ar);
      if(best[t.d]===undefined||d<best[t.d]) best[t.d]=d;
    });
    var cand=Object.keys(best).map(function(k){return {d:parseInt(k,10),dist:best[k]};});
    cand.sort(function(a,b){return a.dist-b.dist;});
    return {cand:cand,top:cand[0].d,dist:cand[0].dist};
  }

  function bbox(strokes){
    var minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
    strokes.forEach(function(s){s.forEach(function(p){
      minx=Math.min(minx,p.x);maxx=Math.max(maxx,p.x);miny=Math.min(miny,p.y);maxy=Math.max(maxy,p.y);
    });});
    return {minx:minx,maxx:maxx,miny:miny,maxy:maxy,w:maxx-minx,h:maxy-miny,cx:(minx+maxx)/2,cy:(miny+maxy)/2};
  }
  // ストロークを「数字ひとつ分」ごとにまとめる（左から右へ）
  function group(strokes){
    var items=strokes.filter(function(s){return s.length>0;}).map(function(s){return {s:s,b:bbox([s])};});
    items.sort(function(a,b){return a.b.minx-b.b.minx;});
    var groups=[];
    items.forEach(function(it){
      var g=null;
      for(var i=groups.length-1;i>=0;i--){
        var gb=groups[i].b;
        var ov=Math.min(gb.maxx,it.b.maxx)-Math.max(gb.minx,it.b.minx);
        var minw=Math.max(Math.min(gb.w,it.b.w),1);
        var contained=(it.b.cx>=gb.minx&&it.b.cx<=gb.maxx);
        if(ov>0.25*minw||contained){g=groups[i];break;}
      }
      if(g){g.strokes.push(it.s);g.b=bbox(g.strokes);}
      else groups.push({strokes:[it.s],b:it.b});
    });
    groups.sort(function(a,b){return a.b.cx-b.b.cx;});
    return groups;
  }
  return {recognize:recognize,group:group,bbox:bbox,SHAPES:SHAPES};
})();

function drawStroke(s){
  var pts=s.p,i;if(!pts.length)return;
  ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=lineW();
  ctx.strokeStyle=s.bad?'#E8821A':'#2A2F45';ctx.fillStyle=ctx.strokeStyle;
  if(pts.length===1){ctx.beginPath();ctx.arc(pts[0].x*cardW,pts[0].y*cardH,lineW()/2,0,6.2832);ctx.fill();return;}
  ctx.beginPath();ctx.moveTo(pts[0].x*cardW,pts[0].y*cardH);
  for(i=1;i<pts.length;i++) ctx.lineTo(pts[i].x*cardW,pts[i].y*cardH);

}

function segDist(p,a,b){
  var dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy,t=l?((p.x-a.x)*dx+(p.y-a.y)*dy)/l:0;
  t=Math.max(0,Math.min(1,t));
  return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy));
}
function eraseAt(p){
  var px={x:p.x*cardW,y:p.y*cardH},rad=cellPx*0.4,changed=false;
  S.ink=S.ink.filter(function(s){
    if(s.step!==S.idx||s.bad) return true;
    var pts=s.p.map(function(q){return {x:q.x*cardW,y:q.y*cardH};}),hit=false;
    if(pts.length===1) hit=Math.hypot(px.x-pts[0].x,px.y-pts[0].y)<rad;
    for(var i=1;i<pts.length&&!hit;i++) if(segDist(px,pts[i-1],pts[i])<rad) hit=true;
    if(hit)changed=true;
    return !hit;
  });
  if(changed) redrawInk();
}
function onPenDown(p){
  var id=cur();if(!WRITE[id])return;
  var T=targets(id),px={x:p.x*cardW,y:p.y*cardH},near=false,hit=null;
  T.forEach(function(t){
    if(!t.el)return;
    var rc=relRect(t.el);
    if(inRect({cx:px.x,cy:px.y},rc,0.5)) hit=t;
    if(Math.hypot(px.x-(rc.x+rc.w/2),px.y-(rc.y+rc.h/2))<cellPx*2.6) near=true;
  });
  if(hit) hit.el.classList.add('touching');
  else if(!near&&T[0]&&T[0].el) showHere(T[0].el,'ここやで！');
}
function clearTouching(){
  var l=document.querySelectorAll('.touching');
  for(var i=0;i<l.length;i++) l[i].classList.remove('touching');
}
cv.addEventListener('pointerdown',function(e){
  if(pid!==null||cur()==='done')return;
  e.preventDefault();
  pid=e.pointerId;
  try{cv.setPointerCapture(pid);}catch(_){}
  clearTimeout(S.evalTimer);clearTimeout(S.waitTimer);clearHere();
  var p=pt(e);
  if(S.tool==='erase'){eraseAt(p);return;}
  drawing={p:[p],step:S.idx,bad:false};
  S.ink.push(drawing);
  drawStroke(drawing);
  onPenDown(p);
});
cv.addEventListener('pointermove',function(e){
  if(e.pointerId!==pid)return;
  e.preventDefault();
  var evs=(e.getCoalescedEvents&&e.getCoalescedEvents())||[e];
  if(!evs.length) evs=[e];
  for(var k=0;k<evs.length;k++){
    var p=pt(evs[k]);
    if(S.tool==='erase'){eraseAt(p);continue;}
    if(!drawing)continue;
    var last=drawing.p[drawing.p.length-1];
    drawing.p.push(p);
    ctx.lineCap='round';ctx.lineWidth=lineW();ctx.strokeStyle='#2A2F45';
    ctx.beginPath();ctx.moveTo(last.x*cardW,last.y*cardH);ctx.lineTo(p.x*cardW,p.y*cardH);ctx.stroke();
  }
});
function penUp(e){
  if(e.pointerId!==pid)return;
  pid=null;
  clearTouching();
  var wasDrawing=!!drawing;
  drawing=null;
  if(S.tool==='erase'){redrawInk();return;}
  if(wasDrawing){
    var id=cur();
    var slow=(id==='writeTens'&&M.sT>0);
    clearTimeout(S.evalTimer);
    S.evalTimer=setTimeout(function(){evaluate(false);},slow?1000:700);
  }
}
cv.addEventListener('pointerup',penUp);
cv.addEventListener('pointercancel',penUp);
cv.addEventListener('contextmenu',function(e){e.preventDefault();});

/* ---- 「ここやで！」 ---- */
var hereEl=null,hereTarget=null,hereTimer=null;
function clearHere(){
  if(hereEl&&hereEl.parentNode) hereEl.parentNode.removeChild(hereEl);
  hereEl=null;
  if(hereTarget) hereTarget.classList.remove('here-target');
  hereTarget=null;
  clearTimeout(hereTimer);
}
function showHere(el,text){
  clearHere();
  if(!el) return;
  var r=el.getBoundingClientRect(),d=document.createElement('div'),below=r.top<90;
  d.className='here';
  d.innerHTML=below?'<span class="tip">▲</span><span class="bub">'+text+'</span>':'<span class="bub">'+text+'</span><span class="tip">▼</span>';
  document.body.appendChild(d);
  var w=d.offsetWidth,h=d.offsetHeight;
  d.style.left=Math.max(4,Math.min(window.innerWidth-w-4,r.left+r.width/2-w/2))+'px';
  d.style.top=Math.max(4,below?r.bottom+4:r.top-h-4)+'px';
  el.classList.add('here-target');
  hereEl=d;hereTarget=el;
  hereTimer=setTimeout(clearHere,4200);
}

/* =========================================================
   手書きの判定
   ========================================================= */
function relRect(el){
  var r=el.getBoundingClientRect(),c=card.getBoundingClientRect();
  return {x:r.left-c.left,y:r.top-c.top,w:r.width,h:r.height};
}
function inRect(b,rc,k){
  var ex=k*rc.w,ey=k*Math.max(rc.h,cellPx*0.8);
  return b.cx>=rc.x-ex&&b.cx<=rc.x+rc.w+ex&&b.cy>=rc.y-ey&&b.cy<=rc.y+rc.h+ey;
}
function toPx(s){return s.p.map(function(q){return {x:q.x*cardW,y:q.y*cardH};});}
function mkRead(r){
  var top=r.cand[0];
  var o={top:top.d,dist:top.dist,conf:top.dist<=TH.maxDist};
  function idx(e){for(var i=0;i<r.cand.length;i++) if(r.cand[i].d===e) return i;return 99;}
  // 書こうとしている数字（e）らしければ、少しくずれていても「合っている」とみなす
  o.accepts=function(e){
    var i=idx(e);if(i>=99)return false;
    var ratio=RELAX?1.8:TH.accept,rank=RELAX?4:TH.rank,cap=TH.maxDist*(RELAX?1.5:1.2);
    return i<=rank&&r.cand[i].dist<=top.dist*ratio&&r.cand[i].dist<=cap;
  };
  return o;
}
function clusterize(objs){
  var pxs=objs.map(toPx),groups=HW.group(pxs),out=[],dust=[];
  groups.forEach(function(g){
    var members=g.strokes.map(function(px){return objs[pxs.indexOf(px)];});
    var size=Math.max(g.b.w,g.b.h);
    if(size<cellPx*TH.dust){dust=dust.concat(members);return;}
    var r=HW.recognize(g.strokes);
    out.push({objs:members,b:g.b,read:r?mkRead(r):null});
  });
  return {cl:out,dust:dust};
}
function flat(cls){var r=[];cls.forEach(function(c){r=r.concat(c.objs);});return r;}

function boardWrong(id,c,T,missing){
  var m=M,d=c.read.top,kind=c.bad.kind,pt=(missing[0]||T[0]).el,PL=CATS[1];
  switch(id){
    case 'writeOnes':
      if(kind==='multi') return {text:'答えの一の位には、1つの数字だけ書くよ。'+(m.pT>0?m.p+'の一の位を書こう。':''),point:pt,cat:PL};
      if(kind==='place'){
        if(d===m.pO) return {text:m.pO+'は 一の位に書こう。',point:pt,cat:PL};
        if(m.pT>0&&d===m.pT) return {text:m.pT+'は、あとで 小さく上に書くよ。今は 一の位だよ。',point:pt,cat:PL};
        return {text:'答えの一の位は、ここやで！',point:pt,cat:PL};
      }
      if(d===m.o+m.b||d===(m.o+m.b)%10) return {text:'たすのではなく、かけ算だよ。'+m.o+'×'+m.b+'を考えよう。',cat:CATS[0],add:true};
      if(d===m.t*m.b||d===(m.t*m.b)%10) return {text:'今は一の位からだよ。'+m.o+'を見てみよう。',cat:CATS[0]};
      if(m.pT>0&&d===m.pT) return {text:m.pT+'は十の位の数だよ。一の位には '+m.p+'の 一の位を書こう。',cat:CATS[0]};
      if(d===m.o||d===m.b) return {text:'かける前の数ではなく、'+m.o+'×'+m.b+'の答えを 見てみよう。',cat:CATS[0]};
      return {text:m.o+'×'+m.b+'を考えよう。'+m.b+'の段を思い出そう。',cat:CATS[0]};
    case 'writeCarry':
      if(kind==='multi') return {text:'繰り上がりは 1つの数字だよ。小さく上に書こう。',point:pt,cat:CATS[2]};
      if(kind==='place'){
        if(d===m.pT) return {text:'十の位の'+m.pT+'も、小さく上に書こう。',point:pt,cat:CATS[2]};
        return {text:'繰り上がりは、ここやで！',point:pt,cat:CATS[2]};
      }
      if(d===m.pO) return {text:m.pO+'は もう 一の位に書いたよ。十の位の'+m.pT+'を、小さく上に書こう。',cat:CATS[2]};
      return {text:m.p+'の 十の位の数を、小さく上に書こう。',cat:CATS[2]};
    case 'writeTens':
      if(kind==='multi') return {text:'ひとつの マスには 1つの数字を書くよ。',point:pt,cat:PL};
      if(kind==='place'){
        if(m.sT>0){
          if(d===m.sT) return {text:m.sT+'は 左のマスに書こう。',point:pt,cat:PL};
          if(d===m.sO) return {text:m.sO+'は 右のマスに書こう。',point:pt,cat:PL};
        }else if(d===m.s) return {text:m.s+'は 十の位に書こう。',point:pt,cat:PL};
        return {text:'答えの十の位は、ここやで！',point:pt,cat:PL};
      }
      if(m.pT>0&&d===m.q) return {text:'上の小さな'+m.pT+'を使おう。'+m.q+'と '+m.pT+'を合わせよう。',cat:CATS[4]};
      if(d===m.t+m.b) return {text:'たすのではなく、かけ算だよ。'+m.t+'×'+m.b+'を考えよう。',cat:CATS[3],add:true};
      if(d===m.pO||d===m.o*m.b) return {text:'今は十の位だよ。'+m.t+'を見てみよう。',cat:CATS[3]};
      if(m.pT>0&&d===m.pT) return {text:'それは繰り上がりの数だよ。'+m.t+'×'+m.b+'と合わせた答えを書こう。',cat:CATS[4]};
      if(d===m.t||d===m.b) return {text:'かける前の数ではなく、'+m.t+'×'+m.b+(m.pT>0?'と繰り上がりを合わせた':'の')+'答えを書こう。',cat:CATS[3]};
      return {text:m.t+'×'+m.b+'を考えよう。'+(m.pT>0?'上の小さな'+m.pT+'も 使うよ。':''),cat:CATS[3]};
  }
  return {text:'もう一度 考えてみよう。',cat:PL};
}

function judgeBoard(id,objs){
  var T=targets(id),cr=clusterize(objs),cl=cr.cl;
  if(!cl.length) return {act:'none',dust:cr.dust};
  if(cl.some(function(c){return !c.read;})) return {act:'unread',remove:flat(cl),dust:cr.dust};
  T.forEach(function(t){t.rect=relRect(t.el);});
  var byT={};
  cl.forEach(function(c){
    var best=null,bd=1e9;
    T.forEach(function(t){
      if(inRect(c.b,t.rect,0.5)){
        var dd=Math.hypot(c.b.cx-(t.rect.x+t.rect.w/2),c.b.cy-(t.rect.y+t.rect.h/2));
        if(dd<bd){bd=dd;best=t;}
      }
    });
    c.tgt=best;
    if(best){(byT[best.key]=byT[best.key]||[]).push(c);}
  });
  cl.forEach(function(c){
    if(!c.tgt){if(!c.read.conf)c.unr=true;else c.bad={kind:'place'};return;}
    if(byT[c.tgt.key].length>1){c.bad={kind:'multi'};return;}
    if(c.read.accepts(c.tgt.val)){c.good=true;return;}
    if(!c.read.conf){c.unr=true;return;}
    c.bad={kind:'digit'};
  });
  var unr=cl.filter(function(c){return c.unr;});
  if(unr.length) return {act:'unread',remove:flat(unr),dust:cr.dust};
  var bads=cl.filter(function(c){return c.bad;}),goods=cl.filter(function(c){return c.good;}),cov={};
  goods.forEach(function(c){cov[c.tgt.key]=true;});
  var missing=T.filter(function(t){return !cov[t.key];});
  if(!bads.length){
    if(!missing.length) return {act:'solve',dust:cr.dust};
    return {act:'partial',point:missing[0].el,dust:cr.dust,msg:'いいね！もうひとつ、ここやで！'};
  }
  var w=boardWrong(id,bads[0],T,missing);
  var r={act:'wrong',cat:w.cat||CAT_OF[id],detail:'「'+bads[0].read.top+'」と読んだ'+(w.add?'（たし算かも）':''),spec:w.text+(bads[0].bad.kind==='digit'?'（「'+bads[0].read.top+'」と読んだよ）':''),point:w.point,remove:flat(bads),dust:cr.dust};
  if(!missing.length&&bads.every(function(c){return c.bad.kind==='place';})) r.act='solveNote';
  return r;
}

function okText(id){
  var m=M;
  switch(id){
    case 'writeOnes': return m.pT>0?'そう！'+m.o+'×'+m.b+'＝'+m.p+'。一の位の'+m.pO+'を ここに書けたね！':'そう！'+m.o+'×'+m.b+'＝'+m.p+'。繰り上がりは ないよ！';
    case 'writeCarry': return '繰り上がりも書けたね！';
    case 'writeTens':
      if(m.pT>0) return m.sT>0?'そう！'+m.q+'＋'+m.pT+'＝'+m.s+'。最後の位だから そのまま書けたね！':'そう！'+m.q+'に繰り上がりの'+m.pT+'を合わせて '+m.s+'だね！';
      return 'そう！'+m.t+'×'+m.b+'＝'+m.s+'！';
  }
  return '';
}
function solveStep(id,note){
  clearTimeout(S.evalTimer);clearTimeout(S.waitTimer);clearHere();
  var txt=okText(id)+(note?' '+note:'');
  var T0=targets(id),key=T0.length?T0[T0.length-1].key:'ans-o';
  S.idx++;
  S.detail=false;
  S.fb={kind:'ok',text:txt,anchor:key};
  renderAll();
}
function logMistake(cat,detail){
  if(!cat) return;
  stats[cat]=(stats[cat]||0)+1;S.mis++;
  mistakes.push({p:M.a+'×'+M.b,cat:cat,detail:detail});
}
function applyResult(id,res){
  silentRemove(res.dust);
  switch(res.act){
    case 'none': redrawInk();return;
    case 'wait':
      S.waitTimer=setTimeout(function(){evaluate(true);},2600);return;
    case 'unread':
      S.unread[id]=(S.unread[id]||0)+1;stats.unread++;
      flashRemove(res.remove);
      S.fb={kind:'hint',text:UNREAD_MSG,anchor:anchorKey()};renderReact();return;
    case 'partial':
      S.fb={kind:'ok',text:res.msg,anchor:anchorKey()};renderReact();showHere(res.point,'ここやで！');return;
    case 'place':
      flashRemove(res.remove);
      S.fb={kind:'hint',text:res.msg,anchor:anchorKey()};renderReact();showHere(res.point,'ここやで！');return;
    case 'wrong':
      S.lv[id]=Math.min(3,(S.lv[id]||0)+1);
      logMistake(res.cat,res.detail);
      flashRemove(res.remove);
      if(res.point) showHere(res.point,'ここやで！');
      showHint(id,res.spec);
      return;
    case 'solve': solveStep(id,'');return;
    case 'solveNote': logMistake(CAT_OF[id],'ちがう場所にも書いた');solveStep(id,'（'+res.spec+'）');return;
  }
}
function evaluate(force){
  clearTimeout(S.evalTimer);clearTimeout(S.waitTimer);
  var id=cur();if(!WRITE[id])return;
  var objs=S.ink.filter(function(s){return s.step===S.idx&&!s.bad;});
  if(!objs.length)return;
  layoutMeasure();
  RELAX=(S.unread[id]||0)>=2;
  var res=judgeBoard(id,objs);
  applyResult(id,res);
}

/* =========================================================
   道具ボタン
   ========================================================= */
function undo(){
  var i=S.ink.length-1;
  while(i>=0&&S.ink[i].bad)i--;
  if(i<0)return;
  var s=S.ink.splice(i,1)[0];
  if(s.step<S.idx) S.idx=s.step;
  S.fb=null;S.detail=false;
  renderAll();
}
function clearStep(){
  S.ink=S.ink.filter(function(s){return s.step!==S.idx;});
  S.fb=null;
  redrawInk();renderReact();
}
var restartTimer=null;
function restart(){
  var b=$('#bRestart');
  if(!restartTimer){
    b.innerHTML='<span class="ic">❓</span>ほんとに？';
    restartTimer=setTimeout(function(){restartTimer=null;b.innerHTML='<span class="ic">🔄</span>はじめ<br>から';},3000);
    return;
  }
  clearTimeout(restartTimer);restartTimer=null;
  b.innerHTML='<span class="ic">🔄</span>はじめ<br>から';
  startProblem(S.pi);
}
function teacherHTML(){
  var m=M,h='';
  h+='<h2>かけ算の意味</h2><p>'+m.a+'×'+m.b+'は「'+m.a+'を'+m.b+'回たす」（'+rep(m.a,m.b)+'）ことでも表せます。ひっ算では、'+m.a+'を「'+m.t+'0と'+m.o+'」に分け、<b>一の位から</b>順に、それぞれに'+m.b+'をかけて、答えを合わせます。</p>';
  h+='<h2>この問題の解き方（先生用）</h2><ol>';
  h+='<li>一の位：'+m.o+'×'+m.b+'＝'+m.p+'</li>';
  if(m.pT>0) h+='<li>'+m.p+'の一の位の'+m.pO+'を答えの一の位に、十の位の'+m.pT+'を十の位の上に小さく書く（繰り上がり）</li>';
  else h+='<li>'+m.p+'を答えの一の位に書く（繰り上がりなし）</li>';
  h+='<li>十の位：'+m.t+'×'+m.b+'＝'+m.q+'</li>';
  h+='<li>'+(m.pT>0?'繰り上がりの'+m.pT+'を合わせる：'+m.q+'＋'+m.pT+'＝'+m.s:'そのまま'+m.s)+'を答えの十の位に書く'+(m.sT>0?'（最後の位なので'+m.s+'をそのまま左に書く）':'')+'</li>';
  h+='<li>答え：'+m.ans+'</li></ol>';
  h+='<h2>手書き数字の読み取りについて</h2><p>書いた線をこの端末の中だけで読み取っています（点の並びを、0〜9の見本と比べる方法。外部サービスは使いません）。書いた場所が、マス目のどこにあたるかも見ています。確かでないときは、まちがいと決めつけず「うまく読めなかったよ」と案内し、書き直してもらいます。同じ場所で2回続けて読めないと、読み取りをさらに甘くして、「先生が OK にする」ボタンも出します。</p>';
  h+='<h2>つまずきメモ（この画面を開いている間だけ）</h2><div class="cats">';
  CATS.forEach(function(c){h+='<span class="cat'+(stats[c]>0?' has':'')+'">'+c+(stats[c]>0?' ×'+stats[c]:'')+'</span>';});
  h+='<span class="cat'+(stats.unread>0?' has':'')+'">読めなかった'+(stats.unread>0?' ×'+stats.unread:'')+'</span></div><ul class="mlog">';
  var last=mistakes.slice(-6).reverse();
  last.forEach(function(x){h+='<li>'+x.p+'：'+x.cat+'（'+x.detail+'）</li>';});
  if(!last.length) h+='<li>まだ まちがいは ありません。</li>';
  h+='</ul><p class="privacy">名前などは保存しません。記録は画面を閉じると消えます。</p>';
  h+='<p><button class="btn" data-act="closeDrawer">とじる</button></p>';
  return h;
}
function startProblem(pi){
  var pr=problems[pi];
  M=makeModel(pr.a,pr.b);
  S={pi:pi,idx:0,ink:[],fb:null,lv:{},wrong:{},unread:{},tool:'pen',mis:0,detail:false,evalTimer:null,waitTimer:null};
  renderAll();
}

/* =========================================================
   イベント
   ========================================================= */
document.addEventListener('click',function(e){
  var t=e.target.closest?e.target.closest('[data-act]'):null;
  if(!t){
    if(e.target===$('#drawer')) $('#drawer').hidden=true;
    return;
  }
  var act=t.getAttribute('data-act');
  if(act==='pen'){S.tool='pen';renderTools();}
  else if(act==='eraser'){S.tool='erase';renderTools();}
  else if(act==='hint') giveHint();
  else if(act==='undo') undo();
  else if(act==='clearStep') clearStep();
  else if(act==='restart') restart();
  else if(act==='nextProblem') startProblem((S.pi+1)%problems.length);
  else if(act==='teacherOk') solveStep(cur(),'（先生が OK にしました）');
  else if(act==='closeDetail'){S.detail=false;renderDetail();}
  else if(act==='drawer'){$('#sheet').innerHTML=teacherHTML();$('#drawer').hidden=false;drawerMode='teacher';}
  else if(act==='closeDrawer'){$('#drawer').hidden=true;drawerMode='';}
  else if(act==='big'){document.documentElement.classList.toggle('big');renderAll();}
});
document.addEventListener('change',function(e){
  if(e.target&&e.target.id==='probSel') startProblem(parseInt(e.target.value,10));
});
['gesturestart','gesturechange','gestureend'].forEach(function(ev){
  document.addEventListener(ev,function(e){e.preventDefault();});
});
var rzTimer=null;
window.addEventListener('resize',function(){clearTimeout(rzTimer);rzTimer=setTimeout(function(){if(S)renderAll();},150);});

/* =========================================================
   起動
   ========================================================= */
startProblem(0);
if(window.google&&google.script&&google.script.run){
  google.script.run
    .withSuccessHandler(function(list){
      if(!Array.isArray(list))return;
      var ok=list.filter(validProblem);
      if(!ok.length)return;
      var a=M.a,b=M.b,k=-1;
      problems=ok;
      problems.forEach(function(p,i){if(p.a===a&&p.b===b&&k<0)k=i;});
      if(k<0) startProblem(0); else {S.pi=k;renderChips();}
    })
    .withFailureHandler(function(){})
    .getProblems();
}
})();
