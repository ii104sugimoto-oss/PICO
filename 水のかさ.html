<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>みずのかさをはかろう！(dL)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --brown: #8B5E34;
    --brown-dark: #6B4423;
    --ink: #4A3B2A;
    --sky-top: #E3F6FF;
    --sky-bottom: #FFF6E2;
    --water-light: #82E0FF;
    --water-dark: #1E9BE0;
    --card: #FFFFFF;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; min-height:100%;
    font-family: 'M PLUS Rounded 1c', sans-serif;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
    color: var(--ink);
    overflow-x:hidden;
  }
  .stage{
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 16px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
  }
  .title{
    font-size: clamp(22px, 5vw, 34px);
    font-weight:800;
    color: var(--brown-dark);
    text-align:center;
    margin: 6px 0 2px;
    text-shadow: 2px 2px 0 #fff, 0 3px 6px rgba(139,94,52,0.15);
  }
  .subtitle{
    font-size: clamp(14px, 3vw, 18px);
    font-weight:700;
    color:#6B7C93;
    margin-bottom: 18px;
    text-align:center;
  }

  .lab{
    background: var(--card);
    border-radius: 32px;
    padding: 28px clamp(12px,4vw,32px) 20px;
    box-shadow: 0 12px 0 #DCE9F2, 0 16px 30px rgba(90,120,150,0.18);
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    position:relative;
  }

  .containers-row{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap: clamp(10px, 4vw, 36px);
    width:100%;
    flex-wrap: wrap;
    position:relative;
  }

  .cup-block{ display:flex; flex-direction:column; align-items:center; }
  .cup-caption{
    margin-top:8px;
    font-weight:700;
    font-size: clamp(13px,2.6vw,16px);
    color: var(--brown-dark);
    background:#FFF3D6;
    padding:4px 14px;
    border-radius:999px;
    border:2px solid #FFD98E;
  }

  svg.cup{ display:block; }
  #bigCupSvg{ width: clamp(160px,32vw,260px); height:auto; }
  #smallCupSvg{ width: clamp(90px,18vw,140px); height:auto; }

  .cup-outline{ fill:none; stroke:var(--brown); stroke-width:5; stroke-linejoin:round; }
  .tick-line{ stroke:var(--brown); stroke-width:3; stroke-linecap:round; }
  .tick-label{ font-family:'M PLUS Rounded 1c',sans-serif; font-weight:700; font-size:15px; fill:var(--brown-dark); }
  .tick-label.emphasis{ fill:#E85D75; font-weight:800; }

  #bigWater, #smallWater{
    transition: y 0.5s cubic-bezier(.4,0,.2,1), height 0.5s cubic-bezier(.4,0,.2,1);
  }
  #bigWaveTop, #smallWaveTop{
    transition: cy 0.5s cubic-bezier(.4,0,.2,1);
  }

  /* pour zone between cups */
  .pour-zone{
    position:absolute;
    pointer-events:none;
    width: 100%;
    height:100%;
    top:0; left:0;
    overflow:visible;
  }
  .drop{
    position:absolute;
    width:10px; height:14px;
    background: radial-gradient(circle at 35% 30%, #BEF3FF, var(--water-dark));
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    opacity:0;
  }
  .drop.fall{ animation: dropFall 0.55s ease-in forwards; }
  @keyframes dropFall{
    0%{ opacity:1; transform: translate(0,0) scale(0.6) rotate(0deg); }
    15%{ opacity:1; }
    100%{ opacity:0.9; transform: translate(var(--dx,-40px), var(--dy,60px)) scale(1) rotate(-15deg); }
  }
  .drip{
    position:absolute;
    width:8px; height:12px;
    background: radial-gradient(circle at 35% 30%, #BEF3FF, var(--water-dark));
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    opacity:0;
    animation: drainFall 0.6s ease-in forwards;
  }
  @keyframes drainFall{
    0%{ opacity:1; transform: translateY(0) scale(0.7); }
    20%{ opacity:1; }
    100%{ opacity:0; transform: translateY(70px) scale(1); }
  }

  /* readout */
  .readout-wrap{
    margin-top: 18px;
    display:flex;
    align-items:baseline;
    gap:8px;
    background: linear-gradient(180deg,#F2FBFF,#E4F5FF);
    border: 3px solid #BFE8FF;
    border-radius: 24px;
    padding: 10px 32px;
    box-shadow: inset 0 -4px 0 rgba(191,232,255,0.6);
  }
  .readout-num{
    font-size: clamp(56px, 12vw, 84px);
    font-weight: 800;
    color: #1E88C7;
    line-height:1;
    text-shadow: 3px 3px 0 #D6EFFF;
    min-width: 1.1ch;
    text-align:right;
    transition: transform 0.15s ease;
  }
  .readout-num.bump{ transform: scale(1.18); }
  .readout-unit{
    font-size: clamp(24px, 5vw, 34px);
    font-weight:800;
    color:#4FA8D8;
  }

  .celebrate{
    margin-top: 14px;
    font-size: clamp(18px, 4.5vw, 28px);
    font-weight: 800;
    color:#fff;
    background: linear-gradient(135deg,#FF8FB3,#FFC15E);
    padding: 10px 26px;
    border-radius: 999px;
    box-shadow: 0 8px 0 #E88A4A, 0 12px 20px rgba(255,140,100,0.35);
    opacity:0;
    transform: translateY(10px) scale(0.9);
    transition: opacity 0.4s ease, transform 0.4s cubic-bezier(.34,1.56,.64,1);
    pointer-events:none;
    text-align:center;
    white-space:nowrap;
  }
  .celebrate.show{
    opacity:1;
    transform: translateY(0) scale(1);
    animation: celebratePulse 1.1s ease-in-out infinite;
  }
  @keyframes celebratePulse{
    0%,100%{ transform: translateY(0) scale(1); }
    50%{ transform: translateY(-4px) scale(1.04); }
  }

  .controls{
    display:flex;
    gap: clamp(10px, 3vw, 20px);
    margin-top: 22px;
    flex-wrap: wrap;
    justify-content:center;
    width:100%;
  }
  .btn{
    font-family:'M PLUS Rounded 1c',sans-serif;
    font-weight:800;
    font-size: clamp(16px, 3.4vw, 20px);
    color:#fff;
    border:none;
    border-radius: 999px;
    padding: 16px 26px;
    min-width: 150px;
    min-height: 60px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15), 0 8px 14px rgba(0,0,0,0.12);
    transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;
    touch-action: manipulation;
  }
  .btn:active{
    transform: translateY(4px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.15), 0 3px 8px rgba(0,0,0,0.12);
  }
  .btn:disabled{
    opacity:0.42;
    cursor:not-allowed;
    filter: grayscale(0.3);
    transform:none;
  }
  .btn:disabled:active{ transform:none; box-shadow: 0 6px 0 rgba(0,0,0,0.15), 0 8px 14px rgba(0,0,0,0.12); }

  .btn-add{ background: linear-gradient(135deg,#3FE0B0,#17B4C7); box-shadow: 0 6px 0 #0E8FA0, 0 8px 14px rgba(23,180,199,0.35); }
  .btn-add:active{ box-shadow: 0 2px 0 #0E8FA0, 0 3px 8px rgba(23,180,199,0.35); }
  .btn-remove{ background: linear-gradient(135deg,#FF9E7A,#FF6161); box-shadow: 0 6px 0 #D6472F, 0 8px 14px rgba(255,97,97,0.35); }
  .btn-remove:active{ box-shadow: 0 2px 0 #D6472F, 0 3px 8px rgba(255,97,97,0.35); }
  .btn-reset{ background: linear-gradient(135deg,#B79CF2,#9575CD); box-shadow: 0 6px 0 #6E4FA8, 0 8px 14px rgba(149,117,205,0.35); }
  .btn-reset:active{ box-shadow: 0 2px 0 #6E4FA8, 0 3px 8px rgba(149,117,205,0.35); }

  .confetti-layer{
    position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:50;
  }
  .confetti{
    position:absolute;
    top:-20px;
    width:10px; height:16px;
    opacity:0.95;
    animation-name: confettiFall;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }
  @keyframes confettiFall{
    0%{ transform: translateY(0) rotate(0deg); }
    100%{ transform: translateY(110vh) rotate(600deg); }
  }

  @media (max-width: 480px){
    .containers-row{ gap: 8px; }
    .btn{ min-width: 110px; padding: 14px 16px; }
  }

  @media (prefers-reduced-motion: reduce){
    .celebrate.show{ animation:none; }
    .drop.fall, .drip{ animation-duration: 0.01s; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="title">みずのかさをはかろう！</div>
  <div class="subtitle">ボタンをおして、1L の ます に みずを いれてみよう</div>

  <div class="lab">
    <div class="containers-row" id="containersRow">

      <div class="cup-block">
        <svg id="bigCupSvg" class="cup" viewBox="0 0 260 400">
          <defs>
            <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="var(--water-light)"/>
              <stop offset="100%" stop-color="var(--water-dark)"/>
            </linearGradient>
            <clipPath id="bigClip">
              <path d="M90,20 L230,20 L230,344 Q230,360 214,360 L106,360 Q90,360 90,344 Z"/>
            </clipPath>
          </defs>
          <g clip-path="url(#bigClip)">
            <rect id="bigWater" x="90" width="140" y="360" height="0" fill="url(#waterGrad)"/>
            <ellipse id="bigWaveTop" cx="160" cy="360" rx="70" ry="5" fill="#EAFCFF" opacity="0.65"/>
          </g>
          <g id="bigTicks"></g>
          <path class="cup-outline" d="M90,20 L230,20 L230,344 Q230,360 214,360 L106,360 Q90,360 90,344 Z"/>
        </svg>
        <div class="cup-caption">1L の ます（10dL）</div>
      </div>

      <div class="pour-zone" id="pourZone"></div>

      <div class="cup-block">
        <svg id="smallCupSvg" class="cup" viewBox="0 0 140 200">
          <defs>
            <clipPath id="smallClip">
              <path d="M20,30 L120,30 L120,158 Q120,170 108,170 L32,170 Q20,170 20,158 Z"/>
            </clipPath>
          </defs>
          <g clip-path="url(#smallClip)">
            <rect id="smallWater" x="20" width="100" y="30" height="140" fill="url(#waterGrad)"/>
            <ellipse id="smallWaveTop" cx="70" cy="30" rx="50" ry="4" fill="#EAFCFF" opacity="0.65"/>
          </g>
          <path class="cup-outline" d="M20,30 L120,30 L120,158 Q120,170 108,170 L32,170 Q20,170 20,158 Z"/>
          <text x="70" y="105" text-anchor="middle" font-family="'M PLUS Rounded 1c',sans-serif" font-weight="800" font-size="20" fill="var(--brown-dark)" opacity="0.55">1dL</text>
        </svg>
        <div class="cup-caption">1dL の ちいさい ます</div>
      </div>

    </div>

    <div class="readout-wrap">
      <span class="readout-num" id="readoutNum">0</span>
      <span class="readout-unit">dL</span>
    </div>

    <div class="celebrate" id="celebrate">🎉 10 dL ＝ 1 L 🎉</div>

    <div class="controls">
      <button class="btn btn-add" id="addBtn">💧 1dL いれる</button>
      <button class="btn btn-remove" id="removeBtn">🚿 1dL すてる</button>
      <button class="btn btn-reset" id="resetBtn">🔄 リセット</button>
    </div>
  </div>
</div>

<div class="confetti-layer" id="confettiLayer"></div>

<script>
(function(){
  const SEG = 34;      // big cup: pixels per 1dL (340 / 10)
  const BOTTOM = 360;   // big cup bottom y
  const SMALL_TOP = 30;
  const SMALL_BOTTOM = 170;
  const MAX_LEVEL = 10;

  let level = 0;
  let pouring = false;

  const bigWater = document.getElementById('bigWater');
  const bigWave = document.getElementById('bigWaveTop');
  const smallWater = document.getElementById('smallWater');
  const smallWave = document.getElementById('smallWaveTop');
  const bigTicks = document.getElementById('bigTicks');
  const readoutNum = document.getElementById('readoutNum');
  const celebrate = document.getElementById('celebrate');
  const addBtn = document.getElementById('addBtn');
  const removeBtn = document.getElementById('removeBtn');
  const resetBtn = document.getElementById('resetBtn');
  const pourZone = document.getElementById('pourZone');
  const confettiLayer = document.getElementById('confettiLayer');

  // build tick marks + labels for big cup
  for(let i=1;i<=MAX_LEVEL;i++){
    const y = BOTTOM - i*SEG;
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1','90'); line.setAttribute('x2','74');
    line.setAttribute('y1',y); line.setAttribute('y2',y);
    line.setAttribute('class','tick-line');
    bigTicks.appendChild(line);

    const text = document.createElementNS('http://www.w3.org/2000/svg','text');
    text.setAttribute('x','68'); text.setAttribute('y', y+5);
    text.setAttribute('text-anchor','end');
    text.setAttribute('class', i===10 ? 'tick-label emphasis' : 'tick-label');
    text.textContent = i===10 ? '10dL(1L)' : (i+'dL');
    bigTicks.appendChild(text);
  }

  function updateBigWater(){
    const y = BOTTOM - level*SEG;
    const h = level*SEG;
    bigWater.setAttribute('y', y);
    bigWater.setAttribute('height', h);
    bigWave.setAttribute('cy', y);
    readoutNum.textContent = level;
    readoutNum.classList.add('bump');
    setTimeout(()=>readoutNum.classList.remove('bump'), 160);
    addBtn.disabled = level >= MAX_LEVEL || pouring;
    removeBtn.disabled = level <= 0 || pouring;
    if(level === MAX_LEVEL){
      celebrate.classList.add('show');
      launchConfetti();
    } else {
      celebrate.classList.remove('show');
    }
  }

  function setSmallWater(full){
    if(full){
      smallWater.setAttribute('y', SMALL_TOP);
      smallWater.setAttribute('height', SMALL_BOTTOM - SMALL_TOP);
      smallWave.setAttribute('cy', SMALL_TOP);
    } else {
      smallWater.setAttribute('y', SMALL_BOTTOM);
      smallWater.setAttribute('height', 0);
      smallWave.setAttribute('cy', SMALL_BOTTOM);
    }
  }

  function spawnDrops(){
    const rowRect = pourZone.getBoundingClientRect();
    // approximate start position: near small cup (right side), end near big cup top (left-center)
    const startX = rowRect.width * 0.62;
    const startY = rowRect.height * 0.28;
    for(let i=0;i<6;i++){
      const drop = document.createElement('div');
      drop.className = 'drop';
      drop.style.left = (startX + (Math.random()*10-5)) + 'px';
      drop.style.top = (startY + (Math.random()*10-5)) + 'px';
      const dx = -(rowRect.width*0.30) + (Math.random()*14-7);
      const dy = rowRect.height*0.42 + (Math.random()*10);
      drop.style.setProperty('--dx', dx+'px');
      drop.style.setProperty('--dy', dy+'px');
      drop.style.animationDelay = (i*40)+'ms';
      pourZone.appendChild(drop);
      requestAnimationFrame(()=> drop.classList.add('fall'));
      setTimeout(()=> drop.remove(), 700 + i*40);
    }
  }

  function spawnDrainDrops(){
    const rowRect = pourZone.getBoundingClientRect();
    const startX = rowRect.width * 0.32;
    const startY = rowRect.height * 0.85;
    for(let i=0;i<5;i++){
      const drip = document.createElement('div');
      drip.className = 'drip';
      drip.style.left = (startX + (Math.random()*40-20)) + 'px';
      drip.style.top = (startY) + 'px';
      drip.style.animationDelay = (i*35)+'ms';
      pourZone.appendChild(drip);
      setTimeout(()=> drip.remove(), 700 + i*35);
    }
  }

  function launchConfetti(){
    const colors = ['#FF6B9D','#FFD166','#4FC3F7','#7ED957','#B388FF'];
    for(let i=0;i<36;i++){
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = (Math.random()*100)+'vw';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.animationDuration = (1.6 + Math.random()*1.2)+'s';
      c.style.animationDelay = (Math.random()*0.4)+'s';
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      confettiLayer.appendChild(c);
      setTimeout(()=> c.remove(), 3200);
    }
  }

  addBtn.addEventListener('click', () => {
    if(pouring || level >= MAX_LEVEL) return;
    pouring = true;
    addBtn.disabled = true; removeBtn.disabled = true;

    setSmallWater(false);       // small cup drains
    spawnDrops();                // stream of drops flies to big cup

    setTimeout(() => {
      level += 1;
      updateBigWater();          // big cup rises
    }, 320);

    setTimeout(() => {
      setSmallWater(true);       // small cup refills
    }, 620);

    setTimeout(() => {
      pouring = false;
      addBtn.disabled = level >= MAX_LEVEL;
      removeBtn.disabled = level <= 0;
    }, 950);
  });

  removeBtn.addEventListener('click', () => {
    if(pouring || level <= 0) return;
    pouring = true;
    addBtn.disabled = true; removeBtn.disabled = true;

    spawnDrainDrops();
    level -= 1;
    updateBigWater();

    setTimeout(() => {
      pouring = false;
      addBtn.disabled = level >= MAX_LEVEL;
      removeBtn.disabled = level <= 0;
    }, 550);
  });

  resetBtn.addEventListener('click', () => {
    pouring = true;
    addBtn.disabled = true; removeBtn.disabled = true;
    level = 0;
    updateBigWater();
    setSmallWater(true);
    setTimeout(() => {
      pouring = false;
      addBtn.disabled = level >= MAX_LEVEL;
      removeBtn.disabled = level <= 0;
    }, 550);
  });

  // init
  setSmallWater(true);
  updateBigWater();
})();
</script>

</body>
</html>
